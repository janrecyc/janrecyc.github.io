name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply custom app icon
        run: |
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -f resources/android-icon/mipmap-$dpi/*.png android/app/src/main/res/mipmap-$dpi/
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp -f resources/android-icon/mipmap-anydpi-v26/*.xml android/app/src/main/res/mipmap-anydpi-v26/
          # เปลี่ยนสีพื้นหลังของ adaptive icon ให้เป็นสีกรมท่าตามดีไซน์ใหม่
          # (หาไฟล์ที่นิยาม ic_launcher_background แล้วแก้ค่าสีในไฟล์นั้น กันปัญหา resource ซ้ำ)
          grep -rl 'ic_launcher_background' android/app/src/main/res/values/*.xml | \
            xargs sed -i -E 's/(<color name="ic_launcher_background">)#[0-9A-Fa-f]{6,8}(<\/color>)/\1#0A0A0F\2/'

      - name: Sync Capacitor (copies www/ + plugins into Android project)
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
