name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply custom app icon
        run: |
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -f resources/android-icon/mipmap-$dpi/*.png android/app/src/main/res/mipmap-$dpi/
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp -f resources/android-icon/mipmap-anydpi-v26/*.xml android/app/src/main/res/mipmap-anydpi-v26/
          # ไอคอนดีไซน์ใหม่อ้างอิง @drawable/ic_launcher_background และ @drawable/ic_launcher_foreground
          # (ไม่ใช่สีพื้นหลังแบบเดิมแล้ว) จึงต้องคัดลอกเลเยอร์ drawable ไปด้วย
          mkdir -p android/app/src/main/res/drawable
          cp -f resources/android-icon/drawable/*.png android/app/src/main/res/drawable/

      - name: Sync Capacitor (copies www/ + plugins into Android project)
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
