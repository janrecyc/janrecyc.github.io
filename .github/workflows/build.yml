name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Compute version
        id: version
        run: |
          # เลขรันของ GitHub Actions (github.run_number) เพิ่มขึ้นทุกครั้งที่บิ้วอัตโนมัติ ไม่ซ้ำ
          # ใช้ค่าเดียวนี้ทั้งสำหรับ native versionCode/versionName และ "เวอร์ชันแอพ"
          # ที่แสดงในหน้าตั้งค่า เพื่อให้สองที่นี้ตรงกันเสมอ ไม่มีวันเพี้ยนกัน
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Write app version into web assets
        run: |
          mkdir -p www/js/generated
          echo "const APP_VERSION = '${{ steps.version.outputs.name }}';" > www/js/generated/version.js

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Enable Java 8+ desugaring (required by @capacitor-community/sqlite on Android)
        run: |
          # @capacitor-community/sqlite's Android native code needs
          # core library desugaring turned on — a well-documented
          # manual setup step for this plugin that `cap add android`/
          # `cap sync` do NOT do automatically. Since android/ is
          # regenerated fresh every build (never committed — see
          # .gitignore), this has to be patched in on every run, same
          # as the versionCode bump below. Appending a second
          # `android {}` / `dependencies {}` block is safe — Gradle's
          # Groovy DSL merges repeated blocks in the same file rather
          # than erroring, so this doesn't disturb Capacitor's
          # generated config above it.
          cat >> android/app/build.gradle << 'GRADLE_EOF'

          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              // เวอร์ชันนี้เข้ากับ AGP ที่ Capacitor 6 ใช้ตอนเขียนโค้ดนี้ —
              // ถ้า Gradle ฟ้อง version conflict ตอน build ให้ลองขยับเลขนี้ขึ้น
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          GRADLE_EOF

      - name: Sync web assets to Android project
        run: npx cap sync android

      - name: Bump app version (versionCode/versionName)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ steps.version.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.version.outputs.name }}\"/" android/app/build.gradle

          # sed ไม่ error ถ้าหา pattern ไม่เจอ (แค่ไม่ทำอะไรเงียบ ๆ) — เช็คซ้ำว่า
          # patch ติดจริง ถ้าไม่ติด (เช่น Capacitor เปลี่ยนรูปแบบไฟล์เริ่มต้นในอนาคต)
          # ให้ build ล้มทันทีแทนที่จะปล่อยผ่านไปแบบเงียบ ๆ ด้วย versionCode เดิม
          if ! grep -q "versionCode ${{ steps.version.outputs.code }}" android/app/build.gradle; then
            echo "::error::versionCode patch ไม่ติด — เช็ครูปแบบเริ่มต้นของ android/app/build.gradle"
            exit 1
          fi
          if ! grep -q "versionName \"${{ steps.version.outputs.name }}\"" android/app/build.gradle; then
            echo "::error::versionName patch ไม่ติด — เช็ครูปแบบเริ่มต้นของ android/app/build.gradle"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
