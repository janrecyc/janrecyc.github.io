name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets to Android project
        run: npx cap sync android

      - name: Bump app version (versionCode/versionName)
        run: |
          # ใช้เลขรันของ GitHub Actions เป็น versionCode — เพิ่มขึ้นทุกครั้งที่บิ้ว ไม่ซ้ำ
          # versionName จะได้ 1.0.<เลขรัน> เช่น 1.0.12
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

          # sed ไม่ error ถ้าหา pattern ไม่เจอ (แค่ไม่ทำอะไรเงียบ ๆ) — เช็คซ้ำว่า
          # patch ติดจริง ถ้าไม่ติด (เช่น Capacitor เปลี่ยนรูปแบบไฟล์เริ่มต้นในอนาคต)
          # ให้ build ล้มทันทีแทนที่จะปล่อยผ่านไปแบบเงียบ ๆ ด้วย versionCode เดิม
          if ! grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle; then
            echo "::error::versionCode patch ไม่ติด — เช็ครูปแบบเริ่มต้นของ android/app/build.gradle"
            exit 1
          fi
          if ! grep -q "versionName \"1.0.${{ github.run_number }}\"" android/app/build.gradle; then
            echo "::error::versionName patch ไม่ติด — เช็ครูปแบบเริ่มต้นของ android/app/build.gradle"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
