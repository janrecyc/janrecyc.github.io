<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ScrapPOS — รับซื้อ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --ink:       #0A0A0F;
  --ink2:      #3A3A4A;
  --ink3:      #8A8A9A;
  --surface:   #F5F5FA;
  --white:     #FFFFFF;
  --primary:   #1A6BFF;
  --primary-d: #0040CC;
  --green:     #00C853;
  --red:       #FF3B30;
  --amber:     #FF9F0A;
  --card-sh:   0 2px 20px rgba(10,10,30,0.07), 0 0 0 0.5px rgba(10,10,30,0.06);
  --card-sh-active: 0 8px 32px rgba(26,107,255,0.18), 0 0 0 1.5px #1A6BFF;
  --r: 20px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body {
  font-family: 'Prompt', sans-serif;
  background: var(--surface);
  color: var(--ink);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}

.status-bar { height: env(safe-area-inset-top, 0px); background: var(--white); flex-shrink: 0; }

header {
  background: var(--white);
  padding: 14px 20px 12px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(10,10,30,0.06);
}
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
.app-logo { display:flex; align-items:center; gap:8px; }
.logo-mark {
  width:32px; height:32px; background:var(--ink); border-radius:9px;
  display:flex; align-items:center; justify-content:center; color:white; font-size:16px;
}
.app-name { font-size:13px; font-weight:700; color:var(--ink3); letter-spacing:2px; text-transform:uppercase; }
.header-actions { display:flex; align-items:center; gap:8px; }
.icon-btn {
  width:36px; height:36px; border-radius:50%; background:var(--surface); border:none;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink2); font-size:18px; cursor:pointer; transition:background .15s;
}
.icon-btn:active{background:#e8e8f0;}
.page-title { font-size:26px; font-weight:800; color:var(--ink); letter-spacing:-0.5px; line-height:1.1; }
.page-sub { font-size:12px; color:var(--ink3); font-weight:400; margin-left:2px; }

.app-body {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}


.catalogue { display:flex; flex-direction:column; overflow:hidden; min-height:0; flex:1; }

.search-area { padding:12px 20px 0; flex-shrink:0; }
.search-field {
  display:flex; align-items:center; gap:10px;
  background:var(--white); border:1px solid rgba(10,10,30,0.08);
  border-radius:14px; padding:10px 14px;
  box-shadow:0 1px 6px rgba(10,10,30,0.05);
  transition:border-color .15s, box-shadow .15s;
}
.search-field:focus-within { border-color:var(--primary); box-shadow:0 0 0 3px rgba(26,107,255,0.12); }
.search-field i { color:var(--ink3); font-size:17px; }
.search-field input {
  flex:1; border:none; outline:none; font-family:'Prompt',sans-serif;
  font-size:14px; color:var(--ink); background:transparent;
}
.search-field input::placeholder{color:var(--ink3);}

.cat-bar {
  display:flex; gap:6px; padding:10px 20px 8px;
  overflow-x:auto; flex-shrink:0; scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-btn {
  flex-shrink:0; padding:6px 16px; border-radius:100px;
  font-family:'Prompt',sans-serif; font-size:13px; font-weight:500;
  border:none; cursor:pointer; transition:all .16s; white-space:nowrap;
}
.cat-btn.on { background:var(--ink); color:white; box-shadow:0 2px 8px rgba(10,10,30,0.2); }
.cat-btn:not(.on) { background:var(--white); color:var(--ink2); border:1px solid rgba(10,10,30,0.08); }
.cat-btn:not(.on):active{background:var(--surface);}

.item-grid-wrap { flex:1; overflow-y:auto; padding:4px 20px 12px; scrollbar-width:none; }
.item-grid-wrap::-webkit-scrollbar{display:none;}
.item-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
@media(min-width:500px){ .item-grid{grid-template-columns:repeat(3,1fr);} }
@media(min-width:900px){ .item-grid{grid-template-columns:repeat(2,1fr);} }
@media(min-width:1100px){ .item-grid{grid-template-columns:repeat(3,1fr);} }

.item-card {
  background:var(--white); border-radius:var(--r); padding:16px 14px 14px;
  cursor:pointer; position:relative; overflow:hidden;
  box-shadow:var(--card-sh); transition:transform .13s, box-shadow .13s;
  user-select:none; -webkit-user-select:none;
  display:flex; flex-direction:column; gap:10px;
  border:1.5px solid transparent;
  min-height:140px;
}
.item-card::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.7) 0%,transparent 50%);
  pointer-events:none;
}
.item-card:active{transform:scale(0.95);}
.item-card.selected { border-color:var(--primary); box-shadow:var(--card-sh-active); }

.card-badge {
  position:absolute; top:10px; right:10px;
  min-width:24px; height:24px; background:var(--primary);
  color:white; border-radius:100px; font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center; padding:0 6px;
  opacity:0; transform:scale(0.6); transition:opacity .18s,transform .18s;
}
.item-card.selected .card-badge { opacity:1; transform:scale(1); }

.card-icon { font-size:34px; line-height:1; display:flex; }
.card-name { font-size:13px; font-weight:600; color:var(--ink); line-height:1.3; }
.card-bottom { display:flex; align-items:flex-end; justify-content:space-between; }
.card-price { font-size:15px; font-weight:700; color:var(--primary); }
.card-price-unit { font-size:11px; font-weight:400; color:var(--ink3); }
.card-add-btn {
  width:30px; height:30px; border-radius:50%; background:var(--primary);
  border:none; color:white; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform .1s, background .15s;
}
.card-add-btn:active{transform:scale(0.85); background:var(--primary-d);}

.grid-loading {
  grid-column:1/-1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
  padding:60px 0; color:var(--ink3);
}
.spin { animation:spin .8s linear infinite; }
@keyframes spin{to{transform:rotate(360deg);}}

/* Phosphor icon pill (iOS app-icon style) */
.ph-icon-wrap {
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:14px;
  flex-shrink:0;
}
.card-icon .ph-icon-wrap { border-radius:14px; }

/* BOTTOM NAV */
nav {
  background:var(--white);
  border-top:1px solid rgba(10,10,30,0.06);
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-row { display:flex; }
.nav-tab {
  flex:1; display:flex; flex-direction:column; align-items:center;
  gap:3px; padding:8px 4px 6px; text-decoration:none;
  color:var(--ink3); font-size:10px; font-weight:500;
  position:relative; transition:color .15s;
}
.nav-tab.on { color:var(--primary); }
.nav-tab i { font-size:20px; }
.nav-tab-indicator {
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:0; height:2px; background:var(--primary); border-radius:0 0 2px 2px;
  transition:width .2s;
}
.nav-tab.on .nav-tab-indicator { width:24px; }

/* TOAST */
#toast {
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
  background:rgba(10,10,30,0.88); color:white;
  padding:10px 20px; border-radius:100px;
  font-size:13px; font-weight:500;
  opacity:0; transition:all .25s; pointer-events:none;
  white-space:normal; max-width:calc(100vw - 40px); text-align:center;
  backdrop-filter:blur(8px); z-index:999;
}
#toast.toast-show { opacity:1; transform:translateX(-50%) translateY(0); }
#toast.toast-error { background:rgba(255,59,48,0.9); }

/* CART PANEL */
.cart-panel {
  background:var(--white);
  border-top: 1px solid rgba(10,10,30,0.07);
  flex-shrink:0;
  overflow:hidden;
  transition: max-height .3s cubic-bezier(0.32,0.72,0,1);
  max-height: 0;
}
.cart-panel.has-items { max-height: 220px; }

.cart-header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 10px 20px 6px;
}
.cart-title {
  font-size:13px; font-weight:700; color:var(--ink2);
  display:flex; align-items:center; gap:6px;
}
.cart-count-badge {
  background:var(--primary); color:white;
  font-size:11px; font-weight:700;
  min-width:20px; height:20px; border-radius:100px;
  display:flex; align-items:center; justify-content:center; padding:0 5px;
}
.cart-clear-btn {
  font-size:12px; color:var(--ink3); background:none; border:none;
  cursor:pointer; font-family:'Prompt',sans-serif; padding:4px 8px;
  border-radius:8px; transition:background .12s;
}
.cart-clear-btn:active { background:var(--surface); }

.cart-items {
  display:flex; gap:8px;
  padding:0 20px 8px;
  overflow-x:auto; scrollbar-width:none;
}
.cart-items::-webkit-scrollbar { display:none; }

.cart-item-chip {
  flex-shrink:0;
  display:flex; align-items:center; gap:6px;
  background:var(--surface); border-radius:12px;
  padding:6px 10px 6px 8px;
  border:1.5px solid rgba(26,107,255,0.15);
  cursor:pointer; transition:all .12s;
}
.cart-item-chip:active { background:#e8edf8; }
.cart-item-chip-icon { font-size:16px; line-height:1; }
.cart-item-chip-info { display:flex; flex-direction:column; }
.cart-item-chip-name { font-size:11px; font-weight:600; color:var(--ink); }
.cart-item-chip-qty  { font-size:11px; color:var(--primary); font-weight:700; }
.cart-item-chip-remove {
  width:16px; height:16px; border-radius:50%;
  background:rgba(10,10,30,0.1); border:none;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; color:var(--ink3); cursor:pointer;
  margin-left:2px; flex-shrink:0;
}

.cart-confirm-row {
  padding: 0 20px 10px;
}
.cart-confirm-btn {
  width:100%; padding:13px;
  border-radius:14px;
  background:linear-gradient(135deg,#00C853 0%,#00A844 100%);
  color:white; border:none;
  font-family:'Prompt',sans-serif; font-size:15px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,200,83,0.35);
  transition:opacity .15s, transform .1s;
}
.cart-confirm-btn:active { opacity:0.85; transform:scale(0.98); }
.cart-confirm-btn:disabled { opacity:0.4; pointer-events:none; box-shadow:none; }

/* LOADING OVERLAY */
.loading-overlay {
  position:fixed; inset:0; background:rgba(245,245,250,0.85);
  display:flex; align-items:center; justify-content:center;
  z-index:500; backdrop-filter:blur(4px);
  transition:opacity .3s;
}
.loading-overlay.hidden { opacity:0; pointer-events:none; }

/* SUPABASE CONFIG BANNER */
.config-banner {
  background:#FFF3CD; border-bottom:2px solid #FF9F0A;
  padding:8px 20px; font-size:12px; font-weight:500; color:#664D03;
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.config-banner i { color:var(--amber); font-size:16px; }
.config-banner a { color:var(--primary); text-decoration:underline; }

/* ══════════════════════════════════════════
   iOS WEIGHT INPUT MODAL — PREMIUM DARK CALCULATOR
══════════════════════════════════════════ */

/* Calculator color palette */
:root {
  --calc-bg:       #1C1C1E;       /* ฐาน sheet สีเข้ม */
  --calc-display:  #111113;       /* area แสดงตัวเลข */
  --calc-num:      #2C2C2E;       /* ปุ่มตัวเลข */
  --calc-num-h:    #3A3A3C;       /* hover/active ปุ่มตัวเลข */
  --calc-func:     #3A3A3C;       /* ปุ่ม function (C, ⌫) */
  --calc-func-h:   #4A4A4C;
  --calc-op:       #F5A623;       /* ปุ่ม operator (+) — amber warm */
  --calc-op-h:     #FFBF47;
  --calc-text:     #FFFFFF;       /* ตัวเลขบนปุ่ม */
  --calc-text-dim: rgba(255,255,255,0.45);
  --calc-handle:   rgba(255,255,255,0.2);
  --calc-divider:  rgba(255,255,255,0.06);
  --calc-val-color:#FFFFFF;
  --calc-accent:   #F5A623;       /* ตัวเลขยอดรวม */
}

.kg-modal-backdrop {
  position:fixed; inset:0; z-index:800;
  background:rgba(0,0,0,0);
  backdrop-filter:blur(0px);
  transition: background .28s ease, backdrop-filter .28s ease;
  pointer-events:none;
}
.kg-modal-backdrop.open {
  background:rgba(0,0,0,0.60);
  backdrop-filter:blur(8px);
  pointer-events:all;
}

.kg-modal {
  position:fixed; left:0; right:0; bottom:0;
  z-index:801;
  background:transparent;
  transform: translateY(100%);
  transition: transform .38s cubic-bezier(0.32,0.72,0,1);
  will-change: transform;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.kg-modal.open {
  transform: translateY(0);
}

.kg-sheet {
  background: var(--calc-bg);
  border-radius: 28px 28px 0 0;
  overflow: hidden;
  box-shadow: 0 -8px 60px rgba(0,0,0,0.55), 0 -1px 0 rgba(255,255,255,0.08);
}

.kg-handle {
  width:40px; height:4px;
  background: var(--calc-handle);
  border-radius:100px;
  margin: 12px auto 0;
}

.kg-header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 20px 10px;
}
.kg-item-info { display:flex; align-items:center; gap:12px; }
.kg-item-icon { font-size:30px; line-height:1; }
.kg-item-name { font-size:16px; font-weight:700; color:#FFFFFF; }
.kg-item-price { font-size:12px; color:rgba(255,255,255,0.45); margin-top:2px; }
.kg-close-btn {
  width:32px; height:32px; border-radius:50%;
  background: rgba(255,255,255,0.10);
  border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.6);
  transition:background .12s;
}
.kg-close-btn:active { background:rgba(255,255,255,0.2); }

/* Display area — dark tape style */
.kg-display {
  margin: 0 16px 0;
  background: var(--calc-display);
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}

/* Tape: scrollable list of committed entries */
.kg-tape {
  display: flex;
  flex-direction: column;
  gap: 0;
  max-height: 110px;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 0;
}
.kg-tape::-webkit-scrollbar { display: none; }
.kg-tape:empty { display: none; }

.kg-tape-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px 6px 16px;
  border-bottom: 1px solid var(--calc-divider);
  animation: tape-in .18s ease;
}
@keyframes tape-in {
  from { opacity:0; transform: translateY(-6px); }
  to   { opacity:1; transform: translateY(0); }
}
.kg-tape-entry:last-child { border-bottom: none; }
.kg-tape-num {
  font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.85);
}
.kg-tape-unit { font-size: 12px; color: rgba(255,255,255,0.35); margin-left: 3px; }
.kg-tape-plus { font-size: 13px; color: var(--calc-op); margin: 0 8px; font-weight:700; }
.kg-tape-del {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,59,48,0.15); border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #FF6B6B; cursor: pointer;
  flex-shrink: 0; margin-left: 4px;
  transition: background .12s;
}
.kg-tape-del:active { background: rgba(255,59,48,0.35); }

/* Divider between tape and input */
.kg-tape-divider {
  height: 1px;
  background: var(--calc-op);
  opacity: 0.25;
  margin: 0;
  display: none;
}
.kg-tape:not(:empty) ~ .kg-tape-divider { display: block; }

/* Current input row */
.kg-input-row {
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 12px 18px 14px;
}
.kg-input-left {}
.kg-display-label {
  font-size:10px; font-weight:600; color:rgba(255,255,255,0.35);
  text-transform:uppercase; letter-spacing:1.2px;
}
.kg-display-val {
  font-size:46px; font-weight:800; color:var(--calc-val-color);
  line-height:1; letter-spacing:-2px;
  min-height:52px;
  display:flex; align-items:center; gap:4px;
}
.kg-display-val .unit {
  font-size:18px; font-weight:500; color:rgba(255,255,255,0.4);
  letter-spacing:0; margin-bottom:4px;
}
.kg-display-val .cursor {
  width:3px; height:42px; background:var(--calc-op);
  border-radius:2px; margin-left:2px;
  animation: blink .9s step-end infinite;
  box-shadow: 0 0 8px rgba(245,166,35,0.6);
}
@keyframes blink { 50%{opacity:0;} }
.kg-display-right {}
.kg-subtotal-label { font-size:10px; color:rgba(255,255,255,0.35); text-align:right; letter-spacing:.5px; text-transform:uppercase; }
.kg-subtotal-val { font-size:22px; font-weight:800; color:var(--calc-accent); text-align:right; margin-top:2px; text-shadow: 0 0 16px rgba(245,166,35,0.4); }

/* Numpad — 3-col grid */
.kg-numpad {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:1.5px;
  background:rgba(0,0,0,0.4);
  border-top:1px solid var(--calc-divider);
  margin:0;
}
.kg-key.plus-key {
  background: rgba(245,166,35,0.12);
}
.kg-key.plus-key:active { background: rgba(245,166,35,0.28); }
.kg-key.plus-key .kg-key-op { color: var(--calc-op) !important; font-size:26px; font-weight:700; }
.kg-key.multiply-key { background: rgba(245,166,35,0.07); }
.kg-key.multiply-key:active { background: rgba(245,166,35,0.22); }
.kg-key.clear-inline-key { background: var(--calc-func) !important; }
.kg-key.clear-inline-key:active { background: rgba(255,59,48,0.35) !important; }

/* numpad keys base */
.kg-key-op {
  font-size:26px; font-weight:600; color:var(--calc-op); line-height:1;
}
.kg-key {
  background: var(--calc-num);
  border:none; padding:0;
  height:68px; display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  font-family:'Prompt',sans-serif;
  transition:background .08s;
  position:relative; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}
.kg-key:active { background:var(--calc-num-h); }
.kg-key.dark {
  background:var(--calc-func);
}
.kg-key.dark:active { background:var(--calc-func-h); }
.kg-key-num {
  font-size:26px; font-weight:500; color:var(--calc-text); letter-spacing:-0.5px;
}
.kg-key-sub {
  font-size:9px; color:var(--calc-text-dim); position:absolute; bottom:10px;
  letter-spacing:.5px;
}
.kg-key-icon { font-size:22px; color:var(--calc-text); }
.kg-key.dark .kg-key-icon { color:rgba(255,255,255,0.75); }
.kg-key.primary-key {
  background:var(--calc-op);
}
.kg-key.primary-key:active { background:var(--calc-op-h); }
.kg-key.primary-key .kg-key-num,
.kg-key.primary-key .kg-key-icon { color:#1C1000; }

/* Ripple on key press */
.ripple {
  position:absolute; border-radius:50%;
  background:rgba(255,255,255,0.15);
  transform:scale(0); animation:ripple-anim .4s linear;
  pointer-events:none;
}
@keyframes ripple-anim{to{transform:scale(4);opacity:0;}}

/* Confirm button inside numpad area */
.kg-confirm-row {
  padding:12px 16px 14px;
  background:var(--calc-bg);
}
.kg-confirm-btn {
  width:100%; padding:16px;
  border-radius:18px;
  background:linear-gradient(135deg,#30D158 0%,#25A847 100%);
  color:white; border:none;
  font-family:'Prompt',sans-serif; font-size:16px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(48,209,88,0.35);
  transition:opacity .15s, transform .1s;
  letter-spacing:.2px;
}
.kg-confirm-btn:active { opacity:0.85; transform:scale(0.98); }

// ══════════════════════════════════════════
let kgModalItemId  = null;
let kgBuffer       = '';       // ตัวเลขที่กำลังพิมพ์อยู่
let kgEntries      = [];       // [{val: number}]  รายการที่บวกแล้ว
let currentMode    = 'kg';     // 'kg' | 'piece'
let kgMultiplyBase = null;     // ตัวเลขแรกก่อน ×

function kgTotal() {
  return kgEntries.reduce((s, e) => s + e.val, 0);
}

function openKgModal(id) {
  id = Number(id);
  const item = ITEMS.find(x => x.id === id);
  if (!item) return;
  kgModalItemId = id;

  document.getElementById('kg-item-icon').innerHTML = renderIcon(item.icon, item.cat, 26);
  document.getElementById('kg-item-name').textContent = item.name;
  document.getElementById('kg-item-price').textContent = `฿${Number(item.buy_price).toFixed(2)} / ${item.unit||'กก.'}`;

  // ซ่อน/แสดง mode toggle แล้วตั้ง mode ให้ถูก
  const itemMode = item.sell_mode || 'kg';
  document.getElementById('kg-mode-toggle').style.display = item.sell_mode === 'piece' ? 'none' : 'flex';
  setMode(itemMode); // reset buffer+entries ใน setMode

  // โหลด qty เดิมจาก cart (หลัง setMode เพื่อไม่ให้ถูก reset)
  if (cart[id]) {
    kgEntries = [{ val: cart[id].qty }];
  }

  updateKgDisplay();

  document.getElementById('kg-backdrop').classList.add('open');
  document.getElementById('kg-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeKgModal() {
  document.getElementById('kg-backdrop').classList.remove('open');
  document.getElementById('kg-modal').classList.remove('open');
  document.body.style.overflow = '';
  kgModalItemId  = null;
  kgBuffer       = '';
  kgEntries      = [];
  kgMultiplyBase = null;
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-btn-kg').classList.toggle('active', mode === 'kg');
  document.getElementById('mode-btn-piece').classList.toggle('active', mode === 'piece');
  if (mode === 'kg') {
    document.getElementById('kg-display-label').textContent = 'น้ำหนัก';
    document.getElementById('kg-unit-label').textContent    = 'กก.';
  } else {
    document.getElementById('kg-display-label').textContent = 'จำนวน';
    document.getElementById('kg-unit-label').textContent    = 'ชิ้น';
  }
  kgBuffer = ''; kgEntries = [];
  updateKgDisplay();
}

function updateKgDisplay() {
  const unitText = currentMode === 'kg' ? 'กก.' : 'ชิ้น';
  const cur      = parseFloat(kgBuffer) || 0;
  const total    = kgTotal() + cur;

  // ── multiply indicator ──
  const lblEl2 = document.getElementById('kg-display-label');
  if (kgMultiplyBase !== null) {
    lblEl2.textContent = `${formatCalc(kgMultiplyBase)} ×`;
    lblEl2.style.color = 'var(--calc-op)';
  } else {
    lblEl2.textContent = currentMode === 'kg' ? 'น้ำหนัก' : 'จำนวน';
    lblEl2.style.color = '';
  }

  // ── tape list ──
  const tapeEl = document.getElementById('kg-tape');
  tapeEl.innerHTML = kgEntries.map((e, i) => `
    <div class="kg-tape-entry">
      <span>
        ${i > 0 ? '<span class="kg-tape-plus">+</span>' : ''}
        <span class="kg-tape-num">${formatCalc(e.val)}</span>
        <span class="kg-tape-unit">${unitText}</span>
      </span>
      <button class="kg-tape-del" onclick="tapeDelete(${i})">
        <i class="ph ph-x"></i>
      </button>
    </div>
  `).join('');
  // auto-scroll tape to bottom
  tapeEl.scrollTop = tapeEl.scrollHeight;

  // ── current buffer ──
  document.getElementById('kg-display-num').textContent = kgBuffer || '0';

  // ── subtotal ──
  const item  = kgModalItemId ? ITEMS.find(x => x.id === kgModalItemId) : null;
  const price = item ? Number(item.buy_price) : 0;
  const sub   = total * price;
  document.getElementById('kg-subtotal').textContent = sub > 0 ? `฿${sub.toFixed(2)}` : '฿0';

  // ── confirm button ──
  const btnEl = document.getElementById('kg-confirm-btn');
  const lblEl = document.getElementById('kg-confirm-label');
  const valid = total > 0;
  btnEl.disabled = !valid;
  if (valid) {
    lblEl.textContent = `เพิ่ม ${formatCalc(total)} ${unitText} = ฿${sub.toFixed(2)}`;
  } else {
    lblEl.textContent = 'เพิ่มในตะกร้า';
  }
}

// ── tape actions ──
function tapeDelete(i) {
  kgEntries.splice(i, 1);
  updateKgDisplay();
}

// ── numpad ──
function kpNum(n, e) {
  rippleKey(e);
  if (kgBuffer.replace(/[^0-9]/g,'').length >= 8) return;
  if (kgBuffer === '0') kgBuffer = n;
  else kgBuffer += n;
  updateKgDisplay();
}

function kpDot(e) {
  rippleKey(e);
  if (currentMode === 'piece') return;
  if (!kgBuffer.includes('.')) {
    if (!kgBuffer) kgBuffer = '0';
    kgBuffer += '.';
  }
  updateKgDisplay();
}

function kpBack(e) {
  rippleKey(e);
  if (kgBuffer.length > 0) {
    // ลบตัวสุดท้ายใน buffer ปัจจุบัน
    kgBuffer = kgBuffer.slice(0, -1);
  } else if (kgEntries.length > 0) {
    // buffer ว่างแล้ว → ดึง entry สุดท้ายกลับมาแก้
    const last = kgEntries.pop();
    kgBuffer = formatCalc(last.val);
  }
  updateKgDisplay();
}

function kpPlus(e) {
  rippleKey(e);
  const cur = parseFloat(kgBuffer);
  if (!cur || cur <= 0) return;
  if (kgMultiplyBase !== null) {
    kgEntries.push({ val: kgMultiplyBase * cur });
    kgMultiplyBase = null;
  } else {
    kgEntries.push({ val: cur });
  }
  kgBuffer = '';
  updateKgDisplay();
}

function formatCalc(v) {
  if (Number.isInteger(v)) return String(v);
  return parseFloat(v.toFixed(4)).toString();
}

function kpClear(e) {
  rippleKey(e);
  kgBuffer = '';
  kgEntries = [];
  kgMultiplyBase = null;
  updateKgDisplay();
}

function kpMultiply(e) {
  rippleKey(e);
  const cur = parseFloat(kgBuffer);
  if (!cur || cur <= 0) return;
  kgMultiplyBase = kgMultiplyBase !== null ? kgMultiplyBase * cur : cur;
  kgBuffer = '';
  updateKgDisplay();
}

function rippleKey(e) {
  if (!e || !e.currentTarget) return;
  const btn = e.currentTarget;
  const r = document.createElement('span');
  r.className = 'ripple';
  const size = Math.max(btn.offsetWidth, btn.offsetHeight);
  r.style.cssText = `width:${size}px;height:${size}px;left:${size/2}px;top:${size/2}px;margin:-${size/2}px;`;
  btn.appendChild(r);
  setTimeout(() => r.remove(), 400);
}

async function confirmKg() {
  // commit buffer ถ้ายังมี
  const cur = parseFloat(kgBuffer);
  if (cur > 0) {
    if (kgMultiplyBase !== null) {
      kgEntries.push({ val: kgMultiplyBase * cur });
      kgMultiplyBase = null;
    } else {
      kgEntries.push({ val: cur });
    }
  }
  kgBuffer = '';

  const total = kgTotal();
  if (!total || total <= 0 || !kgModalItemId) { closeKgModal(); return; }

  const id   = kgModalItemId;
  const item = ITEMS.find(x => x.id === id);
  if (!item) { closeKgModal(); return; }

  const mode      = currentMode;
  const unitLabel = mode === 'kg' ? 'กก.' : (item.unit || 'ชิ้น');

  cart[id] = { item, qty: total, mode, unitLabel };

  closeKgModal();
  renderGrid();
  renderCartPanel();
  toast(`✓ ${item.name} ${formatCalc(total)} ${unitLabel}`);
}

// ══════════════════════════════════════════
//  CART PANEL
// ══════════════════════════════════════════
function renderCartPanel() {
  const panel    = document.getElementById('cart-panel');
  const listEl   = document.getElementById('cart-items-list');
  const countEl  = document.getElementById('cart-count');
  const btnEl    = document.getElementById('cart-confirm-btn');
  const lblEl    = document.getElementById('cart-confirm-label');

  const entries = Object.values(cart);
  const count   = entries.length;

  panel.classList.toggle('has-items', count > 0);
  countEl.textContent = count;

  if (!count) { listEl.innerHTML = ''; return; }

  const totalAmt = entries.reduce((s, c) => {
    // fix floating point: ปัดทศนิยม 2 ตำแหน่ง
    return s + Math.round(c.qty * Number(c.item.buy_price) * 100) / 100;
  }, 0);

  listEl.innerHTML = entries.map(c => `
    <div class="cart-item-chip" onclick="openKgModal(${c.item.id})">
      <div class="cart-item-chip-icon">${renderIcon(c.item.icon, c.item.cat, 14)}</div>
      <div class="cart-item-chip-info">
        <div class="cart-item-chip-name">${c.item.name}</div>
        <div class="cart-item-chip-qty">${c.qty} ${c.unitLabel}</div>
      </div>
      <button class="cart-item-chip-remove" onclick="event.stopPropagation();removeFromCart(${c.item.id})">
        <i class="ph ph-x"></i>
      </button>
    </div>
  `).join('');

  lblEl.textContent = `บันทึก ${count} รายการ — ฿${totalAmt.toFixed(2)}`;
  btnEl.disabled = false;
}

function removeFromCart(id) {
  delete cart[id];
  renderGrid();
  renderCartPanel();
}

function clearCart() {
  cart = {};
  renderGrid();
  renderCartPanel();
}

async function confirmCart() {
  const entries = Object.values(cart);
  if (!entries.length) return;

  const btnEl = document.getElementById('cart-confirm-btn');
  const lblEl = document.getElementById('cart-confirm-label');
  btnEl.disabled = true;
  lblEl.textContent = 'กำลังบันทึก...';

  // fix floating point ตรงนี้ด้วย
  const lines = entries.map(c => ({
    item_id:    c.item.id,
    item_name:  c.item.name,
    qty:        c.qty,
    kg:         c.mode === 'kg' ? c.qty : null,
    mode:       c.mode,
    unit_label: c.unitLabel,
    price:      Number(c.item.buy_price),
    subtotal:   Math.round(c.qty * Number(c.item.buy_price) * 100) / 100,
  }));
  const totalAmt = lines.reduce((s, l) => s + l.subtotal, 0);

  if (!SUPABASE_READY) {
    await new Promise(r => setTimeout(r, 700));
    // บันทึกสำเร็จ → ถามใบเสร็จ
    _pendingReceipt = { lines, totalAmt };
    cart = {};
    renderGrid();
    renderCartPanel();
    showDialog(lines, totalAmt);
    return;
  }

  try {
    const result = await sbFetch('rpc/record_buy_transaction', {
      method: 'POST',
      body: { p_lines: lines },
      prefer: 'return=minimal',
    });
    // result=minimal → PostgREST return body ว่าง (null) เมื่อสำเร็จ
    // ถ้า function throw exception → sbFetch จะ throw ให้อัตโนมัติ (res.ok = false)
    // บันทึกสำเร็จ → ถามใบเสร็จ
    _pendingReceipt = { lines, totalAmt };
    cart = {};
    renderGrid();
    renderCartPanel();
    loadItems();
    showDialog(lines, totalAmt);
  } catch (err) {
    toast('❌ บันทึกไม่สำเร็จ: ' + err.message, 'error');
    btnEl.disabled = false;
    const count = entries.length;
    lblEl.textContent = `บันทึก ${count} รายการ — ฿${totalAmt.toFixed(2)}`;
  }
}

let _pendingReceipt = null;

function fmtB(n) {
  const v = Number(n || 0);
  return v === Math.floor(v)
    ? v.toLocaleString('th-TH')
    : v.toLocaleString('th-TH', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtQtyStr(qty, mode, unit) {
  return `${fmtB(qty)} ${unit || (mode==='kg' ? 'กก.' : 'ชิ้น')}`;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showDialog(lines, totalAmt) {
  document.getElementById('dlg-amount').textContent = '฿' + fmtB(totalAmt);
  document.getElementById('dlg-items').textContent  = lines.length + ' รายการ';
  document.getElementById('dlg-backdrop').classList.add('show');
  document.getElementById('dlg-box').classList.add('show');
}

function hideDialog() {
  document.getElementById('dlg-backdrop').classList.remove('show');
  document.getElementById('dlg-box').classList.remove('show');
}

function skipReceipt() {
  hideDialog();
  toast(`✅ บันทึกแล้ว`);
  _pendingReceipt = null;
}

function openReceipt() {
  hideDialog();
  if (!_pendingReceipt) return;
  const { lines, totalAmt } = _pendingReceipt;

  const now = new Date();
  const dateStr = now.toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });
  const timeStr = now.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
  const billNo  = 'B' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') +
                  String(now.getDate()).padStart(2,'0') + '-' +
                  String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0') +
                  String(now.getSeconds()).padStart(2,'0');
  const totalKg = lines.filter(l=>l.mode==='kg').reduce((s,l)=>s+l.qty,0);

  const linesHtml = lines.map(l => `
    <div class="rp-line">
      <div class="rp-line-left">
        <div class="rp-line-name">${esc(l.item_name)}</div>
        <div class="rp-line-detail">
          ${fmtQtyStr(l.qty, l.mode, l.unit_label)} × ฿${fmtB(l.price)}/${l.unit_label||'กก.'}
        </div>
      </div>
      <div class="rp-line-amt">฿${fmtB(l.subtotal)}</div>
    </div>`).join('');

  const telHtml = SHOP_TEL
    ? `<div class="rp-shop-tel"><i class="ph ph-phone"></i> ${esc(SHOP_TEL)}</div>` : '';

  document.getElementById('rcp-paper').innerHTML = `
    <div class="rp-shop">
      <div class="rp-shop-name">🔄 ${esc(SHOP_NAME)}</div>
      <div class="rp-shop-sub">${esc(SHOP_TAGLINE)}</div>
      ${telHtml}
    </div>
    <hr class="rp-divider">
    <div class="rp-type-badge">
      <i class="ph-fill ph-download-simple"></i> ใบรับซื้อ
    </div>
    <div class="rp-meta-row">
      <span class="rp-meta-label">วันที่</span>
      <span class="rp-meta-val">${dateStr}</span>
    </div>
    <div class="rp-meta-row">
      <span class="rp-meta-label">เวลา</span>
      <span class="rp-meta-val">${timeStr} น.</span>
    </div>
    <div class="rp-meta-row">
      <span class="rp-meta-label">เลขบิล</span>
      <span class="rp-meta-val">${billNo}</span>
    </div>
    <hr class="rp-divider">
    ${linesHtml}
    <div class="rp-total-block">
      <div class="rp-total-row">
        <span class="rp-total-label">ยอดรวม</span>
        <span class="rp-total-amt">฿${fmtB(totalAmt)}</span>
      </div>
      ${totalKg > 0 ? `<div class="rp-total-kg">น้ำหนักรวม ${fmtB(totalKg)} กก.</div>` : ''}
    </div>
    <hr class="rp-divider">
    <div class="rp-footer">ขอบคุณที่ใช้บริการ 🙏<br>${esc(SHOP_NAME)}</div>
    <div class="rp-bill-no">${billNo}</div>
  `;

  document.getElementById('rcp-backdrop').classList.add('show');
  document.getElementById('rcp-sheet').classList.add('show');
  _pendingReceipt = null;
}

function closeReceipt() {

  document.getElementById('rcp-sheet').classList.remove('show');
}

let _sb = null;

async function sbFetch(path, opts = {}) {
  let token = SUPABASE_ANON;
  if (_sb) {
    const { data: { session } } = await _sb.auth.getSession();
    if (session) token = session.access_token;
  }
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers,
    },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.message || `HTTP ${res.status}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadCats() {
  try {
    const r = await sbFetch('categories?select=slug,label,icon&order=id');
    if (r && r.length) CATS = r;
  } catch(_) {}
}

function renderCatBar() {
  const bar = document.getElementById('cat-bar');
  if (!bar) return;
  const catIconHtml = (icon) => {
    if (!icon) return '';
    if (icon.startsWith('ph-fill ')) return `<i class="${icon}"></i> `;
    if (icon.startsWith('ph ph-'))   return `<i class="ph-fill ${icon.slice(3)}"></i> `;
    if (icon.startsWith('ph-'))      return `<i class="ph-fill ${icon}"></i> `;
    return icon + ' ';
  };
  bar.innerHTML = '<button class="cat-btn on" data-cat="all">ทั้งหมด</button>'
    + CATS.map(c=>`<button class="cat-btn" data-cat="${c.slug}">${catIconHtml(c.icon)}${c.label}</button>`).join('');
  bar.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      bar.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('on', b===btn));
      activeCat = btn.dataset.cat;
      renderGrid();
    });
  });
}

let activeCat = 'all';
let query = '';

async function loadItems() {
  const grid = document.getElementById('item-grid');
  grid.innerHTML = `<div class="grid-loading"><i class="ph ph-spinner-gap spin" style="font-size:28px;"></i><span style="font-size:13px;">กำลังโหลดสินค้า...</span></div>`;

  if (!SUPABASE_READY) {
    await new Promise(r => setTimeout(r, 400));
    ITEMS = DEMO_ITEMS;
    document.getElementById('config-banner').style.display = 'flex';
    renderCatBar();
    renderGrid();
    return;
  }

  document.getElementById('config-banner').style.display = 'none';

  try {
    await loadCats();
    renderCatBar();
    ITEMS = await sbFetch('items?select=id,name,icon,buy_price,unit,cat,stock_qty,sell_mode&order=cat,name') || [];
    renderGrid();
  } catch (err) {
    grid.innerHTML = `<div class="grid-loading"><i class="ph ph-warning-circle" style="font-size:28px;color:var(--red);"></i><span style="font-size:13px;color:var(--red);">โหลดไม่สำเร็จ: ${err.message}</span></div>`;
    toast('❌ ' + err.message, 'error');
  }
}

// ══════════════════════════════════════════
//  RENDER GRID
// ══════════════════════════════════════════
function renderGrid() {
  const grid = document.getElementById('item-grid');
  let list = ITEMS;
  if (activeCat !== 'all') list = list.filter(x => x.cat === activeCat);
  if (query) list = list.filter(x => x.name.includes(query));

  if (!list.length) {
    grid.innerHTML = `<div class="grid-loading"><i class="ph ph-magnifying-glass" style="font-size:28px;"></i><span style="font-size:13px;">ไม่พบสินค้า</span></div>`;
    return;
  }

  grid.innerHTML = list.map(item => {
    const inCart = !!cart[item.id];
    const qty    = inCart ? cart[item.id].qty : 0;
    const mode   = inCart ? cart[item.id].mode : (item.sell_mode || 'kg');
    const unit   = mode === 'kg' ? 'กก.' : (item.unit || 'ชิ้น');
    const qtyLabel = qty % 1 === 0 ? qty : qty.toFixed(1);
    return `
    <div class="item-card ${inCart?'selected':''}" onclick="openKgModal(${item.id})">
      <div class="card-badge">${qtyLabel} ${unit}</div>
      <div class="card-icon">${renderIcon(item.icon, item.cat, 26)}</div>
      <div class="card-name">${item.name}</div>
      <div class="card-bottom">
        <div class="card-price">฿${Number(item.buy_price).toFixed(2)}<span class="card-price-unit">/${item.unit||'กก.'}</span></div>
        <button class="card-add-btn" onclick="event.stopPropagation();openKgModal(${item.id})">
          <i class="ph ${inCart?'ph-pencil':'ph-plus'}"></i>
        </button>
      </div>
    </div>`;
  }).join('');
}

// Swipe down to close modal — เฉพาะ handle/header เท่านั้น
let touchStartY = 0;
let swipeFromHandle = false;
const kgHandleEl = document.querySelector('#kg-modal .kg-handle');
const kgHeaderEl = document.querySelector('#kg-modal .kg-header');
[kgHandleEl, kgHeaderEl].forEach(el => {
  if (!el) return;
  el.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
    swipeFromHandle = true;
  }, {passive:true});
});
document.getElementById('kg-modal').addEventListener('touchstart', e => {
  if (!e.target.closest('.kg-handle') && !e.target.closest('.kg-header')) {
    swipeFromHandle = false;
  }
}, {passive:true});
document.getElementById('kg-modal').addEventListener('touchmove', e => {
  if (!swipeFromHandle) return;
  const dy = e.touches[0].clientY - touchStartY;
  if (dy > 60) { swipeFromHandle = false; closeKgModal(); }
}, {passive:true});

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast-show' + (type === 'error' ? ' toast-error' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = ''; }, 2200);
}

    // Demo mode — ข้าม auth
    window.AUTH = { user: { email: 'demo@demo.com' }, logout: () => {} };
    loadItems();
    return;
  }

  const { data: { session } } = await _sb.auth.getSession();
  if (!session) {
    window.location.replace('login.html');
    return;
  }
  window.AUTH = {
    token: session.access_token,
    user: session.user,
    logout: async () => { await _sb.auth.signOut(); window.location.replace('login.html'); }
  };
  loadItems();
})();
</script>
</body>
</html>
