<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ScrapPOS — ขายออก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --ink:       #0A0A0F;
  --ink2:      #3A3A4A;
  --ink3:      #8A8A9A;
  --surface:   #F5F5FA;
  --white:     #FFFFFF;
  --primary:   #FF6B00;
  --primary-d: #CC5200;
  --green:     #00C853;
  --red:       #FF3B30;
  --amber:     #FF9F0A;
  --card-sh:   0 2px 20px rgba(10,10,30,0.07), 0 0 0 0.5px rgba(10,10,30,0.06);
  --card-sh-active: 0 8px 32px rgba(255,107,0,0.20), 0 0 0 1.5px #FF6B00;
  --r: 20px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body {
  font-family:'Prompt',sans-serif;
  background:var(--surface);
  color:var(--ink);
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}

.status-bar{height:env(safe-area-inset-top,0px);background:var(--white);flex-shrink:0;}

header{
  background:var(--white);
  padding:14px 20px 12px;
  flex-shrink:0;
  border-bottom:1px solid rgba(10,10,30,0.06);
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.app-logo{display:flex;align-items:center;gap:8px;}
.logo-mark{
  width:32px;height:32px;background:var(--ink);border-radius:9px;
  display:flex;align-items:center;justify-content:center;color:white;font-size:16px;
}
.app-name{font-size:13px;font-weight:700;color:var(--ink3);letter-spacing:2px;text-transform:uppercase;}
.header-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:36px;height:36px;border-radius:50%;background:var(--surface);border:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-size:18px;cursor:pointer;transition:background .15s;
}
.icon-btn:active{background:#e8e8f0;}
.page-title{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-0.5px;line-height:1.1;}
.page-sub{font-size:12px;color:var(--ink3);font-weight:400;margin-left:2px;}

/* CART FAB — แสดงจำนวนรายการใน cart */
.cart-fab{
  position:relative;
}
.cart-fab-badge{
  position:absolute;top:-4px;right:-4px;
  min-width:16px;height:16px;
  background:var(--primary);color:white;
  border-radius:100px;font-size:9px;font-weight:700;
  display:none;align-items:center;justify-content:center;
  padding:0 3px; border:2px solid var(--white);
}
.cart-fab-badge.show{display:flex;}

.app-body{flex:1;display:flex;flex-direction:column;overflow:hidden;}

.catalogue{display:flex;flex-direction:column;overflow:hidden;min-height:0;flex:1;}

.search-area{padding:12px 20px 0;flex-shrink:0;}
.search-field{
  display:flex;align-items:center;gap:10px;
  background:var(--white);border:1px solid rgba(10,10,30,0.08);
  border-radius:14px;padding:10px 14px;
  box-shadow:0 1px 6px rgba(10,10,30,0.05);
  transition:border-color .15s,box-shadow .15s;
}
.search-field:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,0,0.12);}
.search-field i{color:var(--ink3);font-size:17px;}
.search-field input{
  flex:1;border:none;outline:none;font-family:'Prompt',sans-serif;
  font-size:14px;color:var(--ink);background:transparent;
}
.search-field input::placeholder{color:var(--ink3);}

.cat-bar{display:flex;gap:6px;padding:10px 20px 8px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-btn{
  flex-shrink:0;padding:6px 16px;border-radius:100px;
  font-family:'Prompt',sans-serif;font-size:13px;font-weight:500;
  border:none;cursor:pointer;transition:all .16s;white-space:nowrap;
}
.cat-btn.on{background:var(--ink);color:white;box-shadow:0 2px 8px rgba(10,10,30,0.2);}
.cat-btn:not(.on){background:var(--white);color:var(--ink2);border:1px solid rgba(10,10,30,0.08);}
.cat-btn:not(.on):active{background:var(--surface);}

.item-grid-wrap{flex:1;overflow-y:auto;padding:4px 20px 12px;scrollbar-width:none;}
.item-grid-wrap::-webkit-scrollbar{display:none;}
.item-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:500px){.item-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.item-grid{grid-template-columns:repeat(4,1fr);}}

.item-card{
  background:var(--white);border-radius:var(--r);padding:16px 14px 14px;
  cursor:pointer;position:relative;overflow:hidden;
  box-shadow:var(--card-sh);transition:transform .13s,box-shadow .13s;
  user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;gap:8px;
  border:1.5px solid transparent;
  min-height:148px;
}
.item-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.7) 0%,transparent 50%);
  pointer-events:none;
}
.item-card:active{transform:scale(0.95);}
.item-card.selected{border-color:var(--primary);box-shadow:var(--card-sh-active);}
.item-card.out-of-stock{opacity:0.38;pointer-events:none;}

.card-badge{
  position:absolute;top:10px;right:10px;
  min-width:24px;height:24px;background:var(--primary);
  color:white;border-radius:100px;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 6px;
  opacity:0;transform:scale(0.6);transition:opacity .18s,transform .18s;
}
.item-card.selected .card-badge{opacity:1;transform:scale(1);}

.card-icon{font-size:34px;line-height:1;display:flex;}
.card-name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3;}
.card-stock{
  font-size:10px;font-weight:600;
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 7px;border-radius:100px;
  background:rgba(0,200,83,0.1);color:var(--green);
  width:fit-content;
}
.card-stock.low{background:rgba(255,159,10,0.12);color:var(--amber);}
.card-stock.empty{background:rgba(255,59,48,0.1);color:var(--red);}
.card-bottom{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;}
.card-price{font-size:15px;font-weight:700;color:var(--primary);}
.card-price-unit{font-size:11px;font-weight:400;color:var(--ink3);}
.card-add-btn{
  width:30px;height:30px;border-radius:50%;background:var(--primary);
  border:none;color:white;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,background .15s;
}
.card-add-btn:active{transform:scale(0.85);background:var(--primary-d);}

.grid-loading{
  grid-column:1/-1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  padding:60px 0;color:var(--ink3);
}
.spin{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Phosphor icon pill */
.ph-icon-wrap{
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:14px;flex-shrink:0;
}

/* BOTTOM NAV */
nav{
  background:var(--white);
  border-top:1px solid rgba(10,10,30,0.06);
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-row{display:flex;}
.nav-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:8px 4px 6px;text-decoration:none;
  color:var(--ink3);font-size:10px;font-weight:500;
  position:relative;transition:color .15s;
}
.nav-tab.on{color:var(--primary);}
.nav-tab i{font-size:20px;}
.nav-tab-indicator{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:0;height:2px;background:var(--primary);border-radius:0 0 2px 2px;
  transition:width .2s;
}
.nav-tab.on .nav-tab-indicator{width:24px;}

/* TOAST */
#toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(10,10,30,0.88);color:white;
  padding:10px 20px;border-radius:100px;
  font-size:13px;font-weight:500;
  opacity:0;transition:all .25s;pointer-events:none;
  white-space:normal;max-width:calc(100vw - 40px);text-align:center;
  backdrop-filter:blur(8px);z-index:999;
}
#toast.toast-show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.toast-error{background:rgba(255,59,48,0.9);}

/* CONFIG BANNER */
.config-banner{
  background:#FFF3CD;border-bottom:2px solid #FF9F0A;
  padding:8px 20px;font-size:12px;font-weight:500;color:#664D03;
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.config-banner i{color:var(--amber);font-size:16px;}

/* ══════════════════════════════════════════
   iOS WEIGHT INPUT MODAL — PREMIUM DARK CALCULATOR
══════════════════════════════════════════ */

/* Calculator color palette */
:root {
  --calc-bg:       #1C1C1E;       /* ฐาน sheet สีเข้ม */
  --calc-display:  #111113;       /* area แสดงตัวเลข */
  --calc-num:      #2C2C2E;       /* ปุ่มตัวเลข */
  --calc-num-h:    #3A3A3C;       /* hover/active ปุ่มตัวเลข */
  --calc-func:     #3A3A3C;       /* ปุ่ม function (C, ⌫) */
  --calc-func-h:   #4A4A4C;
  --calc-op:       #F5A623;       /* ปุ่ม operator (+) — amber warm */
  --calc-op-h:     #FFBF47;
  --calc-confirm:  #30D158;       /* ปุ่ม confirm — green */
  --calc-confirm-h:#28B84E;
  --calc-text:     #FFFFFF;       /* ตัวเลขบนปุ่ม */
  --calc-text-dim: rgba(255,255,255,0.45);
  --calc-tape-bg:  rgba(255,255,255,0.05);
  --calc-handle:   rgba(255,255,255,0.2);
  --calc-divider:  rgba(255,255,255,0.06);
  --calc-val-color:#FFFFFF;
  --calc-sub-color:rgba(255,255,255,0.5);
  --calc-accent:   #F5A623;       /* ตัวเลขยอดรวม */
  --calc-preset-bg:rgba(245,166,35,0.12);
  --calc-preset-bd:rgba(245,166,35,0.3);
  --calc-preset-cl:#F5A623;
}

.kg-modal-backdrop {
  position:fixed; inset:0; z-index:800;
  background:rgba(0,0,0,0);
  backdrop-filter:blur(0px);
  transition: background .28s ease, backdrop-filter .28s ease;
  pointer-events:none;
}
.kg-modal-backdrop.open {
  background:rgba(0,0,0,0.60);
  backdrop-filter:blur(8px);
  pointer-events:all;
}

.kg-modal {
  position:fixed; left:0; right:0; bottom:0;
  z-index:801;
  background:transparent;
  transform: translateY(100%);
  transition: transform .38s cubic-bezier(0.32,0.72,0,1);
  will-change: transform;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.kg-modal.open {
  transform: translateY(0);
}

.kg-sheet {
  background: var(--calc-bg);
  border-radius: 28px 28px 0 0;
  overflow: hidden;
  box-shadow: 0 -8px 60px rgba(0,0,0,0.55), 0 -1px 0 rgba(255,255,255,0.08);
}

.kg-handle {
  width:40px; height:4px;
  background: var(--calc-handle);
  border-radius:100px;
  margin: 12px auto 0;
}

.kg-header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 20px 10px;
}
.kg-item-info { display:flex; align-items:center; gap:12px; }
.kg-item-icon { font-size:30px; line-height:1; }
.kg-item-name { font-size:16px; font-weight:700; color:#FFFFFF; }
.kg-item-price { font-size:12px; color:rgba(255,255,255,0.45); margin-top:2px; }

.kg-close-btn {
  width:32px; height:32px; border-radius:50%;
  background: rgba(255,255,255,0.10);
  border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:rgba(255,255,255,0.6);
  transition:background .12s;
}
.kg-close-btn:active { background:rgba(255,255,255,0.2); }

/* Display area — dark tape style */
.kg-display {
  margin: 0 16px 0;
  background: var(--calc-display);
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}

/* Tape: scrollable list of committed entries */
.kg-tape {
  display: flex;
  flex-direction: column;
  gap: 0;
  max-height: 110px;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 0;
}
.kg-tape::-webkit-scrollbar { display: none; }
.kg-tape:empty { display: none; }

.kg-tape-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px 6px 16px;
  border-bottom: 1px solid var(--calc-divider);
  animation: tape-in .18s ease;
}
@keyframes tape-in {
  from { opacity:0; transform: translateY(-6px); }
  to   { opacity:1; transform: translateY(0); }
}
.kg-tape-entry:last-child { border-bottom: none; }
.kg-tape-num {
  font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.85);
}
.kg-tape-unit { font-size: 12px; color: rgba(255,255,255,0.35); margin-left: 3px; }
.kg-tape-plus { font-size: 13px; color: var(--calc-op); margin: 0 8px; font-weight:700; }
.kg-tape-del {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,59,48,0.15); border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #FF6B6B; cursor: pointer;
  flex-shrink: 0; margin-left: 4px;
  transition: background .12s;
}
.kg-tape-del:active { background: rgba(255,59,48,0.35); }

/* Divider between tape and input */
.kg-tape-divider {
  height: 1px;
  background: var(--calc-op);
  opacity: 0.25;
  margin: 0;
  display: none;
}
.kg-tape:not(:empty) ~ .kg-tape-divider { display: block; }

/* Current input row */
.kg-input-row {
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 12px 18px 14px;
}
.kg-input-left {}
.kg-display-label {
  font-size:10px; font-weight:600; color:rgba(255,255,255,0.35);
  text-transform:uppercase; letter-spacing:1.2px;
}
.kg-display-val {
  font-size:46px; font-weight:800; color:var(--calc-val-color);
  line-height:1; letter-spacing:-2px;
  min-height:52px;
  display:flex; align-items:center; gap:4px;
}
.kg-display-val .unit {
  font-size:18px; font-weight:500; color:rgba(255,255,255,0.4);
  letter-spacing:0; margin-bottom:4px;
}
.kg-display-val .cursor {
  width:3px; height:42px; background:var(--calc-op);
  border-radius:2px; margin-left:2px;
  animation: blink .9s step-end infinite;
  box-shadow: 0 0 8px rgba(245,166,35,0.6);
}
@keyframes blink { 50%{opacity:0;} }
.kg-display-right {}
.kg-subtotal-label { font-size:10px; color:rgba(255,255,255,0.35); text-align:right; letter-spacing:.5px; text-transform:uppercase; }
.kg-subtotal-val { font-size:22px; font-weight:800; color:var(--calc-accent); text-align:right; margin-top:2px; text-shadow: 0 0 16px rgba(245,166,35,0.4); }

/* Stock warning (sell-specific) */
.kg-stock-warning {
  margin: 0 16px;
  padding: 8px 14px; border-radius: 12px;
  font-size: 12px; font-weight: 500;
  align-items: center; gap: 6px;
  background: rgba(255,159,10,0.15); color: #FFB340;
  display: flex;
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height .2s, opacity .2s, margin .2s;
  margin-bottom: 0;
}
.kg-stock-warning.show { max-height: 60px; opacity: 1; margin-bottom: 8px; }
.kg-stock-warning i { font-size: 14px; color: var(--calc-op); }

/* Mode toggle */
.kg-mode-toggle-wrap {
  padding: 0 16px; margin-bottom: 8px;
}
.kg-mode-toggle-inner {
  display: flex;
  background: rgba(0,0,0,0.3);
  border-radius: 12px;
  padding: 3px;
  border: 1px solid rgba(255,255,255,0.06);
}
.kg-mode-btn-new {
  flex:1; padding: 8px 0;
  border: none; border-radius: 9px;
  font-family: 'Prompt', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .18s;
  background: transparent; color: rgba(255,255,255,0.4);
}
.kg-mode-btn-new.active {
  background: rgba(245,166,35,0.15);
  color: var(--calc-op);
  box-shadow: 0 1px 6px rgba(0,0,0,0.25);
  border: 1px solid rgba(245,166,35,0.25);
}

/* Numpad — 3-col grid */
.kg-numpad {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:1.5px;
  background:rgba(0,0,0,0.4);
  border-top:1px solid var(--calc-divider);
  margin:0;
}
.kg-key.plus-key {
  background: rgba(245,166,35,0.12);
  grid-column: span 2;
}
.kg-key.plus-key:active { background: rgba(245,166,35,0.28); }
.kg-key.plus-key .kg-key-op { color: var(--calc-op) !important; font-size:26px; font-weight:700; }
.kg-key.confirm-inline-key {
  background: var(--calc-confirm) !important;
}
.kg-key.confirm-inline-key:active { background: var(--calc-confirm-h) !important; }

/* Quick presets */
.kg-presets {
  display:flex; gap:6px;
  padding: 0 16px 10px;
  overflow-x:auto; scrollbar-width:none;
}
.kg-presets::-webkit-scrollbar{display:none;}
.kg-preset-btn {
  flex-shrink:0;
  font-family:'Prompt',sans-serif; font-size:12px; font-weight:700;
  padding:7px 16px; border-radius:100px;
  border:1.5px solid var(--calc-preset-bd);
  background:var(--calc-preset-bg);
  color:var(--calc-preset-cl); cursor:pointer;
  transition:all .12s;
  letter-spacing:.3px;
}
.kg-preset-btn:active { background:rgba(245,166,35,0.28); transform:scale(0.93); }

/* numpad keys base */
.kg-key-op {
  font-size:26px; font-weight:600; color:var(--calc-op); line-height:1;
}
.kg-key {
  background: var(--calc-num);
  border:none; padding:0;
  height:68px; display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  font-family:'Prompt',sans-serif;
  transition:background .08s;
  position:relative; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}
.kg-key:active { background:var(--calc-num-h); }
.kg-key.dark {
  background:var(--calc-func);
}
.kg-key.dark:active { background:var(--calc-func-h); }
.kg-key-num {
  font-size:26px; font-weight:500; color:var(--calc-text); letter-spacing:-0.5px;
}
.kg-key-sub {
  font-size:9px; color:var(--calc-text-dim); position:absolute; bottom:10px;
  letter-spacing:.5px;
}
.kg-key-icon { font-size:22px; color:var(--calc-text); }
.kg-key.dark .kg-key-icon { color:rgba(255,255,255,0.75); }
.kg-key.primary-key {
  background:var(--calc-op);
}
.kg-key.primary-key:active { background:var(--calc-op-h); }
.kg-key.primary-key .kg-key-num,
.kg-key.primary-key .kg-key-icon { color:#1C1000; }

/* Ripple on key press */
.ripple {
  position:absolute; border-radius:50%;
  background:rgba(255,255,255,0.15);
  transform:scale(0); animation:ripple-anim .4s linear;
  pointer-events:none;
}
@keyframes ripple-anim{to{transform:scale(4);opacity:0;}}

/* Confirm button inside numpad area */
.kg-confirm-row {
  padding:12px 16px 14px;
  background:var(--calc-bg);
}
.kg-confirm-btn {
  width:100%; padding:16px;
  border-radius:18px;
  background:linear-gradient(135deg,#30D158 0%,#25A847 100%);
  color:white; border:none;
  font-family:'Prompt',sans-serif; font-size:16px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(48,209,88,0.35);
  transition:opacity .15s, transform .1s;
  letter-spacing:.2px;
}
.kg-confirm-btn:active { opacity:0.85; transform:scale(0.98); }
.kg-confirm-btn:disabled { opacity:0.25; pointer-events:none; box-shadow:none; }

/* ══════════════════════════════════════════

function formatCalc(v) {
  if (Number.isInteger(v)) return String(v);
  return parseFloat(v.toFixed(4)).toString();
}

function setMode(mode) {
  currentMode = mode;
  const isKg  = mode === 'kg';
  const item  = kgModalItemId ? ITEMS.find(x => x.id === kgModalItemId) : null;
  const unit  = isKg ? 'กก.' : (item?.unit || 'ชิ้น');

  document.getElementById('mode-btn-kg').classList.toggle('active', isKg);
  document.getElementById('mode-btn-piece').classList.toggle('active', !isKg);
  document.getElementById('kg-display-label').textContent = isKg ? 'น้ำหนัก' : 'จำนวน';
  document.getElementById('kg-display-unit').textContent  = unit;
  document.getElementById('kg-presets-kg').style.display    = isKg    ? 'flex' : 'none';
  document.getElementById('kg-presets-piece').style.display = !isKg   ? 'flex' : 'none';

  kgBuffer = ''; kgEntries = [];
  updateKgDisplay();
}

function openKgModal(id) {
  id = Number(id);
  const item = ITEMS.find(x => x.id === id);
  if (!item) return;
  kgModalItemId = id;
  currentMode   = item.sell_mode || 'kg';
  kgBuffer      = '';
  kgEntries     = cart[id] ? [{ val: cart[id].qty }] : [];

  document.getElementById('kg-item-icon').innerHTML   = renderIcon(item.icon, item.cat, 26);
  document.getElementById('kg-item-name').textContent  = item.name;
  document.getElementById('kg-item-price').textContent = `฿${Number(item.sell_price).toFixed(2)} / ${item.unit||'กก.'}`;

  // แสดง toggle เฉพาะ item ที่ไม่ได้ fix sell_mode
  const wrap = document.getElementById('kg-mode-toggle-wrap');
  wrap.style.display = item.sell_mode ? 'none' : 'block';

  // sync mode buttons & presets
  const isKg = currentMode === 'kg';
  document.getElementById('mode-btn-kg').classList.toggle('active', isKg);
  document.getElementById('mode-btn-piece').classList.toggle('active', !isKg);
  document.getElementById('kg-display-label').textContent = isKg ? 'น้ำหนัก' : 'จำนวน';
  document.getElementById('kg-display-unit').textContent  = isKg ? 'กก.' : (item.unit||'ชิ้น');
  document.getElementById('kg-presets-kg').style.display    = isKg    ? 'flex' : 'none';
  document.getElementById('kg-presets-piece').style.display = !isKg   ? 'flex' : 'none';

  updateKgDisplay();
  document.getElementById('kg-backdrop').classList.add('open');
  document.getElementById('kg-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeKgModal() {
  document.getElementById('kg-backdrop').classList.remove('open');
  document.getElementById('kg-modal').classList.remove('open');
  document.body.style.overflow = '';
  kgModalItemId = null;
  kgBuffer = '';
  kgEntries = [];
}

function updateKgDisplay() {
  const unitText = currentMode === 'kg' ? 'กก.' : (
    (kgModalItemId ? ITEMS.find(x=>x.id===kgModalItemId)?.unit : null) || 'ชิ้น'
  );
  const cur   = parseFloat(kgBuffer) || 0;
  const total = kgTotal() + cur;
  const item  = kgModalItemId ? ITEMS.find(x => x.id === kgModalItemId) : null;
  const price = item ? Number(item.sell_price) : 0;
  const stock = item ? (item.stock_qty || 0) : Infinity;

  // ── tape ──
  const tapeEl = document.getElementById('kg-tape');
  tapeEl.innerHTML = kgEntries.map((e, i) => `
    <div class="kg-tape-entry">
      <span>
        ${i > 0 ? '<span class="kg-tape-plus">+</span>' : ''}
        <span class="kg-tape-num">${formatCalc(e.val)}</span>
        <span class="kg-tape-unit">${unitText}</span>
      </span>
      <button class="kg-tape-del" onclick="tapeDelete(${i})"><i class="ph ph-x"></i></button>
    </div>
  `).join('');
  tapeEl.scrollTop = tapeEl.scrollHeight;

  // ── buffer display ──
  document.getElementById('kg-display-num').textContent = kgBuffer || '0';

  // ── subtotal ──
  const sub = Math.round(total * price * 100) / 100;
  document.getElementById('kg-subtotal').textContent = sub > 0 ? `฿${sub.toFixed(2)}` : '฿0';

  // ── warnings ──
  const warnEl = document.getElementById('kg-stock-warning');
  const warnTx = document.getElementById('kg-stock-warning-text');
  const isInt  = Number.isInteger(total) || total === 0;
  const over   = total > stock;
  if (over && total > 0) {
    warnTx.textContent = `เกินสต๊อก (มี ${stock.toLocaleString('th-TH')} ${unitText})`;
    warnEl.classList.add('show');
  } else if (currentMode === 'piece' && !isInt && total > 0) {
    warnTx.textContent = 'จำนวนชิ้นต้องเป็นจำนวนเต็ม';
    warnEl.classList.add('show');
  } else {
    warnEl.classList.remove('show');
  }

  // ── confirm button ──
  const btnEl = document.getElementById('kg-confirm-btn');
  const lblEl = document.getElementById('kg-confirm-label');
  const valid = total > 0 && !over && (currentMode === 'kg' || isInt);
  btnEl.disabled = !valid;
  lblEl.textContent = valid
    ? `${cart[kgModalItemId] ? 'อัปเดต' : 'เพิ่ม'} ${formatCalc(total)} ${unitText} = ฿${sub.toFixed(2)}`
    : 'เพิ่มในรายการ';
}

function tapeDelete(i) {
  kgEntries.splice(i, 1);
  updateKgDisplay();
}

function kpNum(n, e) {
  rippleKey(e);
  if (kgBuffer.replace(/[^0-9]/g,'').length >= 8) return;
  kgBuffer = kgBuffer === '0' ? n : kgBuffer + n;
  updateKgDisplay();
}
function kpDot(e) {
  rippleKey(e);
  if (currentMode === 'piece') return;
  if (!kgBuffer.includes('.')) {
    if (!kgBuffer) kgBuffer = '0';
    kgBuffer += '.';
  }
  updateKgDisplay();
}
function kpBack(e) {
  rippleKey(e);
  if (kgBuffer.length > 0) {
    kgBuffer = kgBuffer.slice(0, -1);
  } else if (kgEntries.length > 0) {
    const last = kgEntries.pop();
    kgBuffer = formatCalc(last.val);
  }
  updateKgDisplay();
}
function kpPlus(e) {
  rippleKey(e);
  const cur = parseFloat(kgBuffer);
  if (!cur || cur <= 0) return;
  kgEntries.push({ val: cur });
  kgBuffer = '';
  updateKgDisplay();
}
function setPreset(val) {
  const cur = parseFloat(kgBuffer);
  if (cur > 0) kgEntries.push({ val: cur });
  kgEntries.push({ val });
  kgBuffer = '';
  updateKgDisplay();
  const el = document.getElementById('kg-display-num');
  el.style.transition = 'transform .12s';
  el.style.transform  = 'scale(1.08)';
  setTimeout(() => { el.style.transform = 'scale(1)'; }, 120);
}
function rippleKey(e) {
  if (!e || !e.currentTarget) return;
  const btn = e.currentTarget;
  const r   = document.createElement('span');
  r.className = 'ripple';
  const size = Math.max(btn.offsetWidth, btn.offsetHeight);
  r.style.cssText = `width:${size}px;height:${size}px;left:${size/2}px;top:${size/2}px;margin:-${size/2}px;`;
  btn.appendChild(r);
  setTimeout(() => r.remove(), 400);
}

function confirmKg() {
  const cur = parseFloat(kgBuffer);
  if (cur > 0) kgEntries.push({ val: cur });
  kgBuffer = '';
  const total = kgTotal();
  if (!total || total <= 0 || !kgModalItemId) { closeKgModal(); return; }
  const id   = Number(kgModalItemId);
  const item = ITEMS.find(x => x.id === id);
  if (!item) { closeKgModal(); return; }
  const mode      = currentMode;
  const unitLabel = mode === 'kg' ? 'กก.' : (item.unit || 'ชิ้น');
  const isNew     = !cart[id];
  cart[id] = { item, qty: total, mode, unitLabel };
  closeKgModal();
  toast(isNew ? `+ ${item.name} ${formatCalc(total)} ${unitLabel}` : `✎ ${item.name} → ${formatCalc(total)} ${unitLabel}`);
  renderGrid();
  renderCartBadge();
}
// ══════════════════════════════════════════
//  CART MODAL
// ══════════════════════════════════════════
function openCartModal() {
  renderCartList();
  document.getElementById('cart-backdrop').classList.add('open');
  document.getElementById('cart-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCartModal() {
  document.getElementById('cart-backdrop').classList.remove('open');
  document.getElementById('cart-modal').classList.remove('open');
  document.body.style.overflow = '';
}
function clearCart() {
  if (!Object.keys(cart).length) return;
  cart = {};
  renderCartList();
  renderGrid();
  renderCartBadge();
  toast('ล้างรายการแล้ว');
}
function removeFromCart(id) {
  delete cart[Number(id)];
  renderCartList();
  renderGrid();
  renderCartBadge();
}

function editFromCart(id) {
  closeCartModal();
  setTimeout(() => openKgModal(Number(id)), 350);
}

function renderCartBadge() {
  const n   = Object.keys(cart).length;
  const el  = document.getElementById('cart-fab-badge');
  el.textContent = n;
  el.classList.toggle('show', n > 0);
}

function renderCartList() {
  const listEl  = document.getElementById('cart-list');
  const countEl = document.getElementById('cart-count');
  const tItems  = document.getElementById('t-items');
  const tWt     = document.getElementById('t-weight');
  const tAmt    = document.getElementById('t-amount');
  const sendTag = document.getElementById('send-tag');
  const sendBtn = document.getElementById('send-btn');

  const keys = Object.keys(cart);

  if (!keys.length) {
    listEl.innerHTML = `<div class="cart-empty"><i class="ph ph-truck"></i><p>แตะสินค้าเพื่อเพิ่มรายการส่ง</p></div>`;
    countEl.textContent = '0';
    tItems.textContent  = '0 รายการ';
    tWt.textContent     = '0.00 กก.';
    tAmt.innerHTML      = '<span class="cur">฿</span>0.00';
    sendTag.textContent = '฿0';
    sendBtn.disabled    = true;
    return;
  }

  let totalKg = 0, totalAmt = 0, hasNonKg = false;
  listEl.innerHTML = keys.map(id => {
    const c      = cart[id];
    const price  = Number(c.item.sell_price);
    const sub    = Math.round(c.qty * price * 100) / 100;
    const isKg   = c.mode === 'kg';
    if (isKg) totalKg += c.qty; else hasNonKg = true;
    totalAmt += sub;
    const qtyDisp = c.qty % 1 === 0 ? c.qty : c.qty.toFixed(2);
    return `
    <div class="cart-row">
      <div class="cart-row-icon">${renderIcon(c.item.icon, c.item.cat, 20)}</div>
      <div class="cart-row-info">
        <div class="cart-row-name">${c.item.name}</div>
        <div class="cart-row-sub">${qtyDisp} ${c.unitLabel} × ฿${price} = <b>฿${sub.toFixed(2)}</b></div>
      </div>
      <button class="cart-row-weight-btn" onclick="editFromCart(${id})">
        <span class="cart-row-weight-val">${qtyDisp}</span>
        <span class="cart-row-weight-unit">${c.unitLabel}</span>
        <i class="ph ph-pencil-simple cart-row-weight-icon"></i>
      </button>
      <button class="cart-row-del" onclick="removeFromCart(${id})">
        <i class="ph ph-trash-simple"></i>
      </button>
    </div>`;
  }).join('');

  const fmt = n => n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
  countEl.textContent = keys.length;
  tItems.textContent  = `${keys.length} รายการ`;
  // แสดงน้ำหนักรวมเฉพาะที่เป็น kg / หรือรวมบอก "หลายหน่วย"
  tWt.textContent     = hasNonKg
    ? (totalKg > 0 ? `${totalKg.toFixed(2)} กก. + ชิ้น` : 'หลายหน่วย')
    : `${totalKg.toFixed(2)} กก.`;
  tAmt.innerHTML      = `<span class="cur">฿</span>${fmt(totalAmt)}`;
  sendTag.textContent = `฿${Math.round(totalAmt).toLocaleString('th-TH')}`;
  sendBtn.disabled    = false;
}

// ══════════════════════════════════════════
//  SUPABASE
// ══════════════════════════════════════════
let _sb = null;

async function sbFetch(path, opts = {}) {
  let token = SUPABASE_ANON;
  if (_sb) {
    const { data: { session } } = await _sb.auth.getSession();
    if (session) token = session.access_token;
  }
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers,
    },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.message || `HTTP ${res.status}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ══════════════════════════════════════════
//  LOAD DATA
// ══════════════════════════════════════════
async function loadCats() {
  try {
    const r = await sbFetch('categories?select=slug,label,icon&order=id');
    if (r && r.length) CATS = r;
  } catch(_) {}
}

function renderCatBar() {
  const bar = document.getElementById('cat-bar');
  if (!bar) return;
  const catIconHtml = (icon) => {
    if (!icon) return '';
    if (icon.startsWith('ph-fill ')) return `<i class="${icon}"></i> `;
    if (icon.startsWith('ph ph-'))   return `<i class="ph-fill ${icon.slice(3)}"></i> `;
    if (icon.startsWith('ph-'))      return `<i class="ph-fill ${icon}"></i> `;
    return icon + ' ';
  };
  bar.innerHTML = '<button class="cat-btn on" data-cat="all">ทั้งหมด</button>'
    + CATS.map(c=>`<button class="cat-btn" data-cat="${c.slug}">${catIconHtml(c.icon)}${c.label}</button>`).join('');
  bar.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      bar.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('on', b === btn));
      activeCat = btn.dataset.cat;
      renderGrid();
    });
  });
}

async function loadFactories() {
  try {
    const r = await sbFetch('factories?select=id,name,location&order=id&is_active=eq.true');
    if (r && r.length) FACTORIES = r;
  } catch(_) {}
}

function renderFactorySelect() {
  const sel = document.getElementById('factory-select');
  if (!sel || !FACTORIES.length) return;
  sel.innerHTML = FACTORIES.map(f =>
    `<option value="${f.id}">🏭 ${f.name}${f.location ? ' — '+f.location : ''}</option>`
  ).join('');
}

async function loadItems() {
  const grid = document.getElementById('item-grid');
  grid.innerHTML = `<div class="grid-loading"><i class="ph ph-spinner-gap spin" style="font-size:28px;"></i><span style="font-size:13px;">กำลังโหลดสินค้า...</span></div>`;

  if (!SUPABASE_READY) {
    await new Promise(r => setTimeout(r, 400));
    ITEMS = DEMO_ITEMS;
    document.getElementById('config-banner').style.display = 'flex';
    renderCatBar();
    renderGrid();
    return;
  }

  document.getElementById('config-banner').style.display = 'none';
  try {
    await loadCats();
    await loadFactories();
    renderCatBar();
    renderFactorySelect();
    ITEMS = await sbFetch('items?select=id,name,icon,sell_price,unit,cat,stock_qty,sell_mode&order=cat,name') || [];
    renderGrid();
  } catch (err) {
    grid.innerHTML = `<div class="grid-loading"><i class="ph ph-warning-circle" style="font-size:28px;color:var(--red);"></i><span style="font-size:13px;color:var(--red);">โหลดไม่สำเร็จ: ${err.message}</span></div>`;
    toast('❌ ' + err.message, 'error');
  }
}

// ══════════════════════════════════════════
//  RENDER GRID
// ══════════════════════════════════════════
function renderGrid() {
  const grid = document.getElementById('item-grid');
  let list = ITEMS;
  if (activeCat !== 'all') list = list.filter(x => x.cat === activeCat);
  if (query) list = list.filter(x => x.name.includes(query));

  if (!list.length) {
    grid.innerHTML = `<div class="grid-loading"><i class="ph ph-magnifying-glass" style="font-size:28px;"></i><span style="font-size:13px;">ไม่พบสินค้า</span></div>`;
    return;
  }

  grid.innerHTML = list.map(item => {
    const nid       = Number(item.id);
    const inCart    = !!cart[nid];
    const cartEntry = cart[nid];
    const qty       = inCart ? cartEntry.qty : 0;
    const unitLabel = inCart ? cartEntry.unitLabel : (item.sell_mode === 'piece' ? (item.unit||'ชิ้น') : 'กก.');
    const stock     = item.stock_qty || 0;
    const cls       = stockClass(stock);
    const oos       = stock <= 0;
    const qtyDisp   = qty % 1 === 0 ? qty : qty.toFixed(1);
    const stockUnit = item.unit || (item.sell_mode === 'piece' ? 'ชิ้น' : 'กก.');
    return `
    <div class="item-card ${inCart?'selected':''} ${oos?'out-of-stock':''}" onclick="openKgModal(${nid})">
      <div class="card-badge">${qtyDisp}</div>
      <div class="card-icon">${renderIcon(item.icon, item.cat, 26)}</div>
      <div class="card-name">${item.name}</div>
      <div class="card-stock ${cls}">
        <i class="ph ph-stack-simple" style="font-size:9px;"></i>
        ${stock.toLocaleString('th-TH')} ${stockUnit}${oos?' — หมด':''}
      </div>
      <div class="card-bottom">
        <div class="card-price">฿${Number(item.sell_price).toFixed(2)}<span class="card-price-unit">/${item.unit||'กก.'}</span></div>
        <button class="card-add-btn" onclick="event.stopPropagation();openKgModal(${nid})">
          <i class="ph ${inCart?'ph-pencil':'ph-plus'}"></i>
        </button>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════
//  SAVE SELL TRANSACTION
// ══════════════════════════════════════════
async function saveSellTransaction() {
  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<i class="ph ph-spinner-gap spin"></i><span>กำลังบันทึก...</span>';

  const sel         = document.getElementById('factory-select');
  const factoryId   = FACTORIES.length ? parseInt(sel.value) : null;
  const factoryName = sel.options[sel.selectedIndex].text.replace('🏭 ', '');

  const lines = Object.values(cart).map(c => ({
    item_id:    c.item.id,
    item_name:  c.item.name,
    qty:        c.qty,
    kg:         c.mode === 'kg' ? c.qty : null,
    mode:       c.mode,
    unit_label: c.unitLabel,
    price:      Number(c.item.sell_price),
    subtotal:   Math.round(c.qty * Number(c.item.sell_price) * 100) / 100,
  }));
  const totalAmt = lines.reduce((s, l) => s + l.subtotal, 0);

  if (!SUPABASE_READY) {
    await new Promise(r => setTimeout(r, 700));
    closeCartModal();
    toast(`✓ ส่งแล้ว → ${factoryName.split(' — ')[0]} (Demo)`);
    cart = {};
    renderGrid();
    renderCartBadge();
    return;
  }

  try {
    const result = await sbFetch('rpc/record_sell_transaction', {
      method: 'POST',
      body: { p_factory_id: factoryId, p_factory_name: factoryName, p_lines: lines },
      prefer: 'return=representation',
    });
    if (!result || !result.success) throw new Error('RPC ไม่สำเร็จ');
    closeCartModal();
    toast(`✓ ส่งแล้ว → ${factoryName.split(' — ')[0]} | ฿${totalAmt.toFixed(2)}`);
    cart = {};
    renderGrid();
    renderCartBadge();
    loadItems();
  } catch (err) {
    toast('❌ บันทึกไม่สำเร็จ: ' + err.message, 'error');
    sendBtn.disabled = false;
    sendBtn.innerHTML = `<i class="ph ph-truck"></i><span>ยืนยันส่งโรงงาน</span><span class="send-amount-tag" id="send-tag">฿${Math.round(totalAmt).toLocaleString('th-TH')}</span>`;
  }
}

document.getElementById('search-input').addEventListener('input', e => {
  query = e.target.value.trim();
  renderGrid();
});

// Swipe down to close modals
function swipeClose(modalId, closeFn) {
  let ty = 0;
  document.getElementById(modalId).addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, {passive:true});
  document.getElementById(modalId).addEventListener('touchmove',  e => { if (e.touches[0].clientY - ty > 70) closeFn(); }, {passive:true});
}
swipeClose('kg-modal',   closeKgModal);
swipeClose('cart-modal', closeCartModal);

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast-show' + (type === 'error' ? ' toast-error' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = ''; }, 2400);
}
