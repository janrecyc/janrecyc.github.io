<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPN App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="statusbar-spacer"></div>

  <div class="hero">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M6 10V8a6 6 0 0 1 10.2-4.3" stroke="#f06c9b" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="4" y="10" width="16" height="11" rx="3" stroke="#f06c9b" stroke-width="1.8"/>
      </svg>
    </div>
    <div class="status-title">คุณไม่ได้รับการปกป้อง</div>
    <div class="location-pill">
      <span>🇹🇭</span>
      <span id="ip-address">ไทย · 1.46.19.228</span>
    </div>

    <div class="map-wrap">
      <svg viewBox="0 0 400 300"><rect width="400" height="300" fill="none"/></svg>
      <div class="pulse-marker">
        <div class="pulse-ring"></div>
        <div class="pulse-dot"></div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="section-label">การเชื่อมต่อฟรี</div>

    <div class="free-card">
      <div class="free-card-row">
        <div class="bolt-badge">
          <svg viewBox="0 0 24 24" fill="#0a2e22"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        </div>
        <div class="free-card-text">
          <div class="free-card-title">เซิร์ฟเวอร์ฟรีที่เร็วที่สุด</div>
          <div class="free-card-sub">เลือกอัตโนมัติจาก 🇺🇸 🇳🇱 🇯🇵 +7</div>
        </div>
        <button class="info-btn" aria-label="ข้อมูลเพิ่มเติม">i</button>
      </div>
      <button class="connect-btn" id="connect-btn">เชื่อมต่อ</button>
    </div>

    <a class="discover-link" href="country.html">ค้นพบ VPN Plus →</a>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item active" href="index.html">
      <span class="nav-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></svg>
      </span>
      หน้าหลัก
    </a>
    <a class="nav-item" href="country.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>
      ประเทศ
    </a>
    <a class="nav-item" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="14" rx="2"/><path d="M4 8h16M9 4v4"/></svg>
      โปรไฟล์
    </a>
    <a class="nav-item" href="settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      การตั้งค่า
    </a>
  </nav>
</div>
<script src="js/app.js"></script>
</body>
</html>
