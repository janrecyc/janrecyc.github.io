<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ScrapPOS — ประวัติการซื้อขาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/history.css">
</head>
<body>

<div class="status-bar"></div>

<header>
  <div class="header-top">
    <a class="back-btn" href="dashboard.html" title="กลับ"><i class="ph ph-arrow-left"></i></a>
    <div class="page-title">ประวัติการซื้อขาย</div>
  </div>
  <div class="hf-pills">
    <button class="hf-pill on" onclick="setFilter(this,'all')">ทั้งหมด</button>
    <button class="hf-pill" onclick="setFilter(this,'buy')">รับซื้อ</button>
    <button class="hf-pill" onclick="setFilter(this,'sell')">ขายออก</button>
    <button class="hf-pill" onclick="setFilter(this,'sort')">คัดแยก</button>
    <button class="hf-pill" onclick="setFilter(this,'cash')">เงินสด</button>
  </div>
</header>

<div class="scroll-body">
  <div id="tl-wrap"></div>
</div>

<!-- ══ DETAIL SHEET ══ -->
<div class="hd-backdrop" id="hd-backdrop" onclick="closeDetail()"></div>
<div class="hd-sheet" id="hd-sheet">
  <div class="hd-handle-row"><div class="hd-handle"></div></div>
  <div class="hd-hero">
    <div class="hd-icon" id="hd-icon"></div>
    <div class="hd-title" id="hd-title">—</div>
    <div class="hd-date" id="hd-date">—</div>
    <div class="hd-amt" id="hd-amt">—</div>
  </div>
  <div class="hd-body" id="hd-body"></div>
  <button class="hd-close-btn" onclick="closeDetail()">ปิด</button>
</div>

<script src="../js/supabase.js"></script>
<script src="../js/db.js"></script>
<script src="../js/local-rest.js"></script>
<script src="../js/history.js"></script>
</body>
</html>
