<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ScrapPOS — คัดแยก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/sort.css">
</head>
<body>

<div class="status-bar"></div>
<div class="config-banner" id="config-banner">
  <i class="ph ph-warning-circle"></i>
  <span>Demo mode — ยังไม่ได้เชื่อม Supabase จริง</span>
</div>

<header>
  <div class="header-top">
    <div class="app-logo">
      <div class="logo-mark"><i class="ph ph-recycle"></i></div>
      <span class="app-name">ScrapPOS</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="resetAll()" title="เริ่มใหม่"><i class="ph ph-arrows-counter-clockwise"></i></button>
      <button class="icon-btn" onclick="window.AUTH && window.AUTH.logout()"><i class="ph ph-sign-out"></i></button>
    </div>
  </div>
  <div class="page-title">คัดแยก <span class="page-sub">Sort</span></div>
</header>

<!-- step indicator -->
<div class="step-bar">
  <div class="step-pill active" id="sp-1"></div>
  <div class="step-pill" id="sp-2"></div>
  <div class="step-pill" id="sp-3"></div>
  <span class="step-label" id="sp-label">ขั้น 1/3</span>
</div>

<div class="app-body">

  <!-- ══ STEP 1 ══ -->
  <div class="panel active" id="panel-1">
    <div class="search-area">
      <div class="search-field">
        <i class="ph ph-magnifying-glass"></i>
        <input type="text" id="search-1" placeholder="ค้นหาวัตถุดิบ...">
      </div>
    </div>
    <div class="cat-bar" id="cat-bar"><button class="cat-btn on" data-cat="all">ทั้งหมด</button></div>
    <div class="item-grid-wrap">
      <div class="item-grid" id="grid-1">
        <div class="grid-loading"><i class="ph ph-spinner-gap spin" style="font-size:28px;"></i><span style="font-size:13px;">กำลังโหลด...</span></div>
      </div>
    </div>

    <!-- bottom bar idle -->
    <div class="bottom-bar" id="bar-idle">
      <div class="bar-idle-inner">
        <div class="bar-idle-icon"><i class="ph ph-arrow-fat-lines-right"></i></div>
        <div class="bar-idle-text">
          <div class="bottom-bar-title">เลือกวัตถุดิบก่อน</div>
          <div class="bottom-bar-sub">แตะสินค้าด้านบนเพื่อเริ่ม</div>
        </div>
        <div class="bar-idle-btn">ถัดไป <i class="ph ph-arrow-right"></i></div>
      </div>
    </div>

    <!-- bottom bar selected -->
    <div class="bottom-bar" id="bar-selected" style="display:none;">
      <div class="bar-selected-inner">
        <div class="bar-selected-top">
          <div class="bar-selected-icon" id="bar-item-icon">⚡</div>
          <div class="bar-selected-info">
            <div class="bar-selected-name" id="bar-item-name">—</div>
            <div class="bar-selected-stock" id="bar-item-stock">—</div>
          </div>
          <button class="from-weight-pill" onclick="openFromKgModal()" id="from-weight-pill">
            <span class="from-weight-val" id="from-weight-display">0</span>
            <span class="from-weight-unit">กก.</span>
            <i class="ph ph-pencil-simple from-weight-icon"></i>
          </button>
        </div>
        <div class="bar-selected-bottom">
          <button class="next-btn" id="btn-next-1" disabled onclick="goStep(2)">
            ถัดไป <i class="ph ph-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ STEP 2 ══ -->
  <div class="panel" id="panel-2">
    <div class="from-chip">
      <div class="from-chip-icon" id="s2-icon"></div>
      <span class="from-chip-name" id="s2-name">—</span>
      <span class="from-chip-kg" id="s2-kg">0 กก.</span>
    </div>
    <div class="section-label">
      คัดแยกได้อะไรบ้าง
      <span id="sel-count-wrap" style="display:none;"><span class="sel-count-badge" id="sel-count-text"></span></span>
    </div>
    <div class="result-grid-wrap">
      <div class="result-grid" id="grid-2">
        <div class="grid-loading" style="grid-column:1/-1;"><i class="ph ph-spinner-gap spin" style="font-size:28px;"></i></div>
      </div>
    </div>
    <div class="panel-footer">
      <div class="footer-row">
        <button class="btn-back" onclick="goStep(1)"><i class="ph ph-arrow-left"></i> ย้อนกลับ</button>
        <button class="btn-confirm" id="btn-next-2" disabled onclick="goStep(3)">ใส่น้ำหนัก <i class="ph ph-arrow-right"></i></button>
      </div>
    </div>
  </div>

  <!-- ══ STEP 3 ══ -->
  <div class="panel" id="panel-3">
    <div class="from-chip">
      <div class="from-chip-icon" id="s3-icon"></div>
      <span class="from-chip-name" id="s3-name">—</span>
      <span class="from-chip-kg" id="s3-kg">0 กก.</span>
    </div>
    <div class="section-label">ใส่น้ำหนักแต่ละชนิด</div>
    <div class="weight-wrap" id="weight-wrap">
      <div class="total-card" id="total-card">
        <span class="total-label">มูลค่ารวมโดยประมาณ</span>
        <span class="total-val" id="total-val">฿0.00</span>
      </div>
    </div>
    <div class="panel-footer">
      <div class="footer-row">
        <button class="btn-back" onclick="goStep(2)"><i class="ph ph-arrow-left"></i> ย้อนกลับ</button>
        <button class="btn-confirm" id="btn-save" disabled onclick="saveSort()"><i class="ph ph-check-circle"></i> บันทึก</button>
      </div>
    </div>
  </div>

</div>

<nav>
  <div class="nav-row">
    <a href="buy.html" class="nav-tab"><div class="nav-tab-indicator"></div><i class="ph ph-download-simple"></i><span>รับซื้อ</span></a>
    <a href="sell.html" class="nav-tab"><div class="nav-tab-indicator"></div><i class="ph ph-upload-simple"></i><span>ขายออก</span></a>
    <a href="sort.html" class="nav-tab on"><div class="nav-tab-indicator"></div><i class="ph-fill ph-recycle"></i><span>คัดแยก</span></a>
    <a href="items.html" class="nav-tab"><div class="nav-tab-indicator"></div><i class="ph ph-pencil-simple"></i><span>สินค้า</span></a>
    <a href="dashboard.html" class="nav-tab"><div class="nav-tab-indicator"></div><i class="ph ph-chart-pie-slice"></i><span>Dashboard</span></a>
  </div>
</nav>

<div id="toast"></div>

<!-- ══ iOS WEIGHT MODAL ══ -->
<div class="kg-modal-backdrop" id="kg-backdrop" onclick="closeKgModal()"></div>
<div class="kg-modal" id="kg-modal">
  <div class="kg-sheet">
    <div class="kg-handle"></div>
    <div class="kg-header">
      <div class="kg-item-info">
        <div class="kg-item-icon" id="kg-item-icon"></div>
        <div>
          <div class="kg-item-name" id="kg-item-name">—</div>
          <div class="kg-item-sub" id="kg-item-sub">—</div>
        </div>
      </div>
      <button class="kg-close-btn" onclick="closeKgModal()"><i class="ph ph-x"></i></button>
    </div>
    <div class="kg-stock-warning" id="kg-stock-warning">
      <i class="ph ph-warning"></i><span id="kg-stock-warning-text"></span>
    </div>
    <div class="kg-display">
      <div>
        <div class="kg-display-label">น้ำหนัก</div>
        <div class="kg-display-val">
          <span id="kg-display-num">0</span>
          <span class="unit">กก.</span>
          <span class="cursor"></span>
        </div>
      </div>
      <div>
        <div class="kg-subtotal-label" id="kg-subtotal-label">ยอด</div>
        <div class="kg-subtotal-val" id="kg-subtotal">—</div>
      </div>
    </div>
    <div class="kg-presets" id="kg-presets"></div>
    <div class="kg-numpad">
      <button class="kg-key" onclick="kpNum('1',event)"><span class="kg-key-num">1</span></button>
      <button class="kg-key" onclick="kpNum('2',event)"><span class="kg-key-num">2</span><span class="kg-key-sub">ABC</span></button>
      <button class="kg-key" onclick="kpNum('3',event)"><span class="kg-key-num">3</span><span class="kg-key-sub">DEF</span></button>
      <button class="kg-key" onclick="kpNum('4',event)"><span class="kg-key-num">4</span><span class="kg-key-sub">GHI</span></button>
      <button class="kg-key" onclick="kpNum('5',event)"><span class="kg-key-num">5</span><span class="kg-key-sub">JKL</span></button>
      <button class="kg-key" onclick="kpNum('6',event)"><span class="kg-key-num">6</span><span class="kg-key-sub">MNO</span></button>
      <button class="kg-key" onclick="kpNum('7',event)"><span class="kg-key-num">7</span><span class="kg-key-sub">PQRS</span></button>
      <button class="kg-key" onclick="kpNum('8',event)"><span class="kg-key-num">8</span><span class="kg-key-sub">TUV</span></button>
      <button class="kg-key" onclick="kpNum('9',event)"><span class="kg-key-num">9</span><span class="kg-key-sub">WXYZ</span></button>
      <button class="kg-key dark" onclick="kpDot(event)"><span class="kg-key-num" style="font-size:20px">.</span></button>
      <button class="kg-key" onclick="kpNum('0',event)"><span class="kg-key-num">0</span></button>
      <button class="kg-key dark" onclick="kpBack(event)"><i class="ph ph-backspace kg-key-icon"></i></button>
    </div>
    <div class="kg-confirm-row">
      <button class="kg-confirm-btn" id="kg-confirm-btn" onclick="confirmKg()" disabled>
        <i class="ph ph-check-circle"></i>
        <span id="kg-confirm-label">ยืนยัน</span>
      </button>
    </div>
  </div>
</div>

<script src="../js/supabase.js"></script>
<script src="../js/db.js"></script>
<script src="../js/local-rest.js"></script>
<script src="../js/shop-brand.js"></script>
<script src="../js/sort.js"></script>
</body>
</html>
