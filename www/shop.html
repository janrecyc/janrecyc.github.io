<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script src="js/auth/session.js"></script>
<script src="js/auth/guard.js"></script>
<script src="js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านค้า</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/history.css">
<link rel="stylesheet" href="css/buy.css">
<link rel="stylesheet" href="css/scrap-shared.css">
<!-- Phosphor icons — needed by the "รับซื้อ" and "ประวัติการซื้อขาย"
     tabs (ported from ScrapPOS, see js/pages/buy-tab.js and
     history-tab.js); every other icon on this page is still the
     template's own inline SVG. html2canvas is buy-tab.js's receipt
     screenshot generator, used by its "ส่ง LINE" button. -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="app">
  <div class="statusbar-spacer"></div>
  <div class="shell">
    <nav class="bottom-nav" id="nav-mount"></nav>
    <main class="main">
      <div class="top-bar" id="search-toggle-mount"></div>
      <div class="page-header">
        <span>ร้านค้า</span>
      </div>
      <div class="content">
        <div id="search-mount"></div>
        <div class="filter-tabs" id="filters-mount"></div>
        <div id="shop-mount"></div>
      </div>
    </main>
  </div>
</div>

<!-- ══ HISTORY DETAIL SHEET ══ (only used by the "ประวัติการซื้อขาย"
     tab — js/pages/history-tab.js — kept outside .content so it
     survives #shop-mount being re-rendered on every tab switch) -->
<div class="hd-backdrop" id="hd-backdrop" onclick="closeDetail()"></div>
<div class="hd-sheet" id="hd-sheet">
  <div class="hd-handle-row"><div class="hd-handle"></div></div>
  <div class="hd-hero">
    <div class="hd-icon" id="hd-icon"></div>
    <div class="hd-title" id="hd-title">—</div>
    <div class="hd-date" id="hd-date">—</div>
    <div class="hd-amt" id="hd-amt">—</div>
  </div>
  <div class="hd-body" id="hd-body"></div>
  <button class="hd-close-btn" onclick="closeDetail()">ปิด</button>
</div>

<!-- ══ BUY TAB OVERLAYS ══ (only used by the "รับซื้อ" tab —
     js/pages/buy-tab.js — kept outside .content, same reasoning as
     the history detail sheet above) -->
<div id="toast"></div>

<!-- CONFIRM DIALOG -->
<div class="dialog-backdrop" id="dlg-backdrop"></div>
<div class="dialog-box" id="dlg-box">
  <div class="dialog-handle-row"><div class="dialog-handle"></div></div>
  <div class="dialog-icon"><i class="ph-fill ph-check-circle"></i></div>
  <div class="dialog-title">บันทึกสำเร็จ! 🎉</div>
  <div class="dialog-sub">ต้องการพิมพ์ใบเสร็จให้ลูกค้าไหม?</div>
  <div class="dialog-summary">
    <div>
      <div class="dialog-summary-label">ยอดที่จ่าย</div>
      <div class="dialog-summary-amount" id="dlg-amount">฿0</div>
    </div>
    <div style="text-align:right;">
      <div class="dialog-summary-items" id="dlg-items">0 รายการ</div>
    </div>
  </div>
  <div class="dialog-btn-row">
    <button class="dialog-btn no" onclick="skipReceipt()">
      <i class="ph ph-x"></i> ไม่ต้องการ
    </button>
    <button class="dialog-btn yes" onclick="openReceipt()">
      <i class="ph ph-receipt"></i> ต้องการใบเสร็จ
    </button>
  </div>
</div>

<!-- RECEIPT SHEET -->
<div class="receipt-backdrop" id="rcp-backdrop" onclick="closeReceipt()"></div>
<div class="receipt-sheet" id="rcp-sheet">
  <div class="receipt-handle-row"><div class="receipt-handle"></div></div>
  <div class="receipt-paper" id="rcp-paper"><!-- filled by JS --></div>
  <div class="receipt-actions">
    <button class="ra-btn close" onclick="closeReceipt()">
      <i class="ph ph-arrow-left"></i> ปิด
    </button>
    <button class="ra-btn line" onclick="sendLine()">
      <i class="ph-fill ph-chat-circle-text"></i> ส่ง LINE
    </button>
    <button class="ra-btn print" onclick="printReceipt()">
      <i class="ph ph-printer"></i> พิมพ์ใบเสร็จ
    </button>
  </div>
</div>

<!-- KG ENTRY MODAL -->
<div class="kg-modal-backdrop" id="kg-backdrop" onclick="closeKgModal()"></div>
<div class="kg-modal" id="kg-modal">
  <div class="kg-sheet">
    <div class="kg-handle"></div>

    <div class="kg-header">
      <div class="kg-item-info">
        <div class="kg-item-icon" id="kg-item-icon">🔩</div>
        <div>
          <div class="kg-item-name" id="kg-item-name">เหล็กหนัก</div>
          <div class="kg-item-price" id="kg-item-price">฿4.50 / กก.</div>
        </div>
      </div>
      <button class="kg-close-btn" onclick="closeKgModal()">
        <i class="ph ph-x"></i>
      </button>
    </div>

    <div class="kg-mode-toggle" id="kg-mode-toggle">
      <button class="kg-mode-btn active" id="mode-btn-kg" onclick="setMode('kg')">
        <i class="ph ph-barbell"></i> กิโลกรัม
      </button>
      <button class="kg-mode-btn" id="mode-btn-piece" onclick="setMode('piece')">
        <i class="ph ph-stack"></i> ชิ้น / อัน
      </button>
    </div>

    <div class="kg-display">
      <div class="kg-tape" id="kg-tape"></div>
      <div class="kg-input-row">
        <div class="kg-input-left">
          <div class="kg-display-label" id="kg-display-label">น้ำหนัก</div>
          <div class="kg-display-val">
            <span id="kg-display-num">0</span>
            <span class="unit" id="kg-unit-label">กก.</span>
            <span class="cursor"></span>
          </div>
        </div>
        <div class="kg-display-right">
          <div class="kg-subtotal-label">รวม</div>
          <div class="kg-subtotal-val" id="kg-subtotal">฿0</div>
        </div>
      </div>
    </div>

    <div class="kg-numpad">
      <button class="kg-key" onclick="kpNum('1',event)"><span class="kg-key-num">1</span></button>
      <button class="kg-key" onclick="kpNum('2',event)"><span class="kg-key-num">2</span></button>
      <button class="kg-key" onclick="kpNum('3',event)"><span class="kg-key-num">3</span></button>

      <button class="kg-key" onclick="kpNum('4',event)"><span class="kg-key-num">4</span></button>
      <button class="kg-key" onclick="kpNum('5',event)"><span class="kg-key-num">5</span></button>
      <button class="kg-key" onclick="kpNum('6',event)"><span class="kg-key-num">6</span></button>

      <button class="kg-key" onclick="kpNum('7',event)"><span class="kg-key-num">7</span></button>
      <button class="kg-key" onclick="kpNum('8',event)"><span class="kg-key-num">8</span></button>
      <button class="kg-key" onclick="kpNum('9',event)"><span class="kg-key-num">9</span></button>

      <button class="kg-key dark" onclick="kpDot(event)"><span class="kg-key-num" style="font-size:20px">.</span></button>
      <button class="kg-key" onclick="kpNum('0',event)"><span class="kg-key-num">0</span></button>
      <button class="kg-key dark" onclick="kpBack(event)"><i class="ph ph-backspace kg-key-icon"></i></button>

      <button class="kg-key multiply-key" onclick="kpMultiply(event)">
        <span class="kg-key-op" style="color:var(--calc-op);font-size:22px;font-weight:700;">×</span>
      </button>
      <button class="kg-key plus-key" onclick="kpPlus(event)"><span class="kg-key-op">+</span></button>
      <button class="kg-key dark clear-inline-key" onclick="kpClear(event)">
        <i class="ph ph-x kg-key-icon"></i>
      </button>
    </div>

    <div class="kg-confirm-row">
      <button class="kg-confirm-btn" id="kg-confirm-btn" onclick="confirmKg()" disabled>
        <i class="ph ph-check-circle"></i>
        <span id="kg-confirm-label">เพิ่มในตะกร้า</span>
      </button>
    </div>
  </div>
</div>

<script src="js/data/nav.js"></script>
<script src="js/components/nav.js"></script>
<script src="js/data/shop-items.js"></script>
<script src="js/data/shop-tabs.js"></script>
<script src="js/components/shop-item-list.js"></script>
<script src="js/components/tab-filter.js"></script>
<script src="js/components/search-bar.js"></script>
<script src="js/supabase.js"></script>
<script src="js/scrap-db/db.js"></script>
<script src="js/scrap-db/local-rest.js"></script>
<script src="js/pages/history-tab.js"></script>
<script src="js/pages/buy-tab.js"></script>
<script src="js/pages/shop-page.js"></script>
<script>
  renderNav('shop');
  initShopPage();
</script>
</body>
</html>
