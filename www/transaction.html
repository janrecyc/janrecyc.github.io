<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทำรายการ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <button class="back-btn" onclick="location.href='index.html'">←</button>
  <h1 id="page-title">ทำรายการ</h1>
</header>

<main>
  <div class="item-list" id="item-list"></div>
  <button class="add-item-btn" id="add-item-btn">＋ เพิ่มสินค้าใหม่</button>

  <div class="field" style="margin-top:20px;">
    <label id="qty-label">น้ำหนัก / จำนวน</label>
    <input type="number" inputmode="decimal" id="qty-input" placeholder="0">
  </div>

  <div class="field">
    <label id="price-label">ราคาต่อหน่วย (แก้ไขได้)</label>
    <input type="number" inputmode="decimal" id="price-input" placeholder="0">
  </div>

  <div class="total-box">
    <div class="lbl">ยอดรวม</div>
    <div class="amt" id="total-amt">฿0.00</div>
  </div>

  <button class="save-btn" id="save-btn" disabled>บันทึกรายการ</button>
</main>

<!-- Modal เพิ่มสินค้าใหม่ -->
<div class="modal-overlay" id="item-modal" style="display:none;">
  <div class="modal-sheet">
    <h2>เพิ่มสินค้าใหม่</h2>
    <div class="field"><label>ชื่อสินค้า</label><input type="text" id="new-item-name" placeholder="เช่น เหล็ก, ทองแดง"></div>
    <div class="field"><label>หน่วย</label><input type="text" id="new-item-unit" placeholder="กก." value="กก."></div>
    <div class="field"><label>ราคารับซื้อ / หน่วย</label><input type="number" inputmode="decimal" id="new-item-buy" placeholder="0"></div>
    <div class="field"><label>ราคาขายออก / หน่วย</label><input type="number" inputmode="decimal" id="new-item-sell" placeholder="0"></div>
    <div class="modal-actions">
      <button class="cancel" id="modal-cancel">ยกเลิก</button>
      <button class="confirm" id="modal-confirm">บันทึก</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/db.js"></script>
<script src="js/capacitor-bridge.js"></script>
<script src="js/transaction.js"></script>
</body>
</html>
